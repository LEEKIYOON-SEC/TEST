  - 암호화‧접근통제 등 기술적 보호대책 등을 고려하여야 한다.
  - 비밀 등 중요 정보를 안전하게 처리하기 위해 다음과 같은 기능을 구현한 시스템을 자체 개발하거나 그 기능을
