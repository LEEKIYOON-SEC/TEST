domain: 12. 보안관리
domain_number: 12
category: 관리적 분야
items:
- id: A-73
  title: "시스템 및 정보보호시스템 접근기록(로그 등)을 생성‧보관하고, 이에 대한 비인가 열람, 훼손 등을 방지하기 위한 보호대책 운영"
  related_org: "정보보호 부서, 시스템 운영 부서"
  description:
  - "서버, 응용프로그램, 네트워크 장비, 보안 장비(정보보호시스템)에 대해 사용자 및 관리자 등의 접근기록(로그 등)이 생성되도록 하며, 이러한 접근기록은 비인가자의 무단 열람이나 위·변조를 방지하기 위해 접근통제 등을 적용하여 안전하게 보관하여야 한다."
  - "시스템 접근기록은 공격자 및 유지보수 운영자에 의해 훼손될 우려가 있으므로, 로그 서버 운영 또는 백업매체를 통해 별도로 보관하여야 한다. 또한, 로그서버 관리자 또는 백업 관리자를 지정하여 보안을 강화하여야 한다."
  - "시스템 및 정보보호시스템 접근기록은 최소 1년 이상 보관하여야 한다"
  - "관계 법규에 따라 시스템의 접속기록 보관기간(예: 개인정보처리시스템의 경우 최소 1년 이상 또는 최소 2년 이상) 등이 정해져 있는 경우가 존재하므로, 보관하여야 하는 접속기록의 대상과 기간 등에 유의하여야 한다."
  considerations:
  - "시스템 및 정보보호시스템 관리자는 접근기록의 정확성을 확보하기 위해 시간 동기화 프로토콜(NTP)을 적용하여야 한다."
  - |
    개인정보처리시스템에 접속한 사용자가 수행한 업무 내역은 식별자, 접속 일시, 접속지 정보, 처리한 정보주체 정보, 수행 업무 등을 포함하여 전자적으로 기록하여야 하며 접속기록 보존기간은 다음과 같다.
    | 보존 기간 | 구분 |
    | --- | --- |
    | 최소 1년 이상 | 일반적 보존기간 |
    | 최소 2년 이상 | 5만명 이상의 정보주체에 관한 개인정보를 처리하는 개인정보처리시스템 |
    | | 고유식별정보 또는 민감정보를 처리하는 개인정보처리시스템 |
    | | 개인정보처리자로서 「전기통신사업법」 제6조 제1항에 따라 등록된 기간통신사업자 |
  - "WORM(Write Once Read Many) 스토리지 등 덮어쓰기 방지 매체에 접근기록을 저장할 경우 위‧변조, 훼손 등을 방지할 수 있다."
  laws:
    common:
    - "정보통신기반 보호법 제10조(보호지침)"
    - "개인정보 보호법 제29조(안전조치의무)"
    - "개인정보의 안전성 확보조치 기준 제8조(접속기록의 보관 및 점검)"
    public:
    - "국가 정보보안 기본지침 제55조(로그기록 유지)"
    finance:
    - "전자금융거래법 제21조(안전성의 확보의무)"
    - "전자금융감독규정 제12조(단말기 보호대책), 제13조(전산자료 보호대책), 제15조(해킹 등 방지대책), 제18조(IP주소 관리대책)"
    ict:
    - "정보보호 및 개인정보보호 관리체계 인증 등에 관한 고시 [별표7] 2.9.4 로그 및 접속기록 관리"
  checklist:
  - "로그관리 절차"
  - "로그기록 내역"
  - "로그 저장장치에 대한 접근통제 내역"
  - "개인정보 접속기록 내역"
  - "개인정보 다운로드 시 사유 확인 기준 및 결과"
  domain: "12. 보안관리"
- id: A-74
  title: "시스템과 네트워크의 오류, 오·남용(비인가접속, 과다조회 등), 부정행위 등 이상징후를 인지할 수 있도록 로그 검토 주기, 대상, 방법 등을 포함한 로그 검토 및 모니터링 절차 수립 및 이행"
  related_org: "정보보호 부서, 시스템 운영 부서"
  description:
  - "시스템 및 네트워크의 오류, 오·남용(비인가접속, 과다조회 등), 부정행위 등 이상징후를 인지할 수 있도록 로그 검토 주기, 대상, 방법 등을 포함한 로그 검토 및 모니터링 절차를 수립·이행하여야 한다."
  - "서버에 대한 성능 및 용량을 관리하는 시스템(SMS; Server Management System), 네트워크에 대한 모니터링을 수행하는 시스템(NMS; Network Management System)을 이용하여 이상징후에 대한 지속적인 모니터링하여야 한다."
  considerations:
  - "개인정보 보호법에서는 개인정보처리시스템의 접속기록을 월1회 이상 점검하도록 요구하고 있으므로, 관계 법규에 따른 법적 준거성을 고려하여 접속기록 검토 절차를 수립·이행하여야 한다."
  - "내·외부에 의한 침해시도, 개인정보유출 시도, 부정행위 등 이상행위를 효과적으로 탐지할 수 있도록 각종 개별 보안솔루션 및 통합보안 모니터링 솔루션 등을 통해 이상징후에 대한 지속적인 모니터링 방안을 마련할 필요가 있다."
  laws:
    common:
    - "정보통신기반 보호법 제10조(보호지침)"
    - "개인정보 보호법 제29조(안전조치의무)"
    - "개인정보의 안전성 확보조치 기준 제8조(접속기록의 보관 및 점검)"
    public:
    - "국가 정보보안 기본지침 제55조(로그기록 유지)"
    finance:
    - "전자금융거래법 제21조(안전성의 확보의무)"
    - "전자금융감독규정 제14조(정보처리시스템 보호대책)"
    ict:
    - "정보보호 및 개인정보보호 관리체계 인증 등에 관한 고시 [별표7] 2.9.5 로그 및 접속기록 점검, 2.11.3(이상행위 분석 및 모니터링)"
  checklist:
  - 서버, 네트워크 장비에 대한 성능 및 용량 모니터링 체계
  - 로그 검토 및 모니터링 절차
  - 로그 검토 및 모니터링 결과(검토 내역, 보고서 등)
  - 이상징후 발견 시 대응 증적
  domain: 12. 보안관리
- id: A-75
  title: "로그 및 모니터링 결과를 월 1회 이상 책임자에게 보고"
  related_org: "정보보호 부서, 시스템 운영 부서"
  description:
  - "기반시설의 정보시스템을 대상으로 로그 검토 및 모니터링을 정기적으로 수행하고 점검결과를 월 1회 이상 책임자에게 보고하여야 한다. 또한, 점검결과 비인가자의 접속시도, 자료 위변조, 정보 유출 등 의심스러운 정황이나 위반사실이 발견되면 즉시 책임자에게 보고하여야 한다."
  - "개인정보의 접속기록은 오ㆍ남용, 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손 등에 대응하기 위하여 관련 법령에서 정한 기준에 따라 월 1회 이상 점검하여 책임자에게 보고하여야 한다."
  considerations:
  - "정보시스템에 비인가자 혹은 근무 시간 외 다운로드 등 이상징후가 확인된 경우, 로그검토 기준에 따라 사유를 확인하고, 그 결과를 책임자에게 보고하여야 한다."
  - "기반시설의 개인정보처리시스템에서 개인정보의 다운로드가 확인된 경우, 내부 관리계획 등 기준에 따라 사유를 확인하고, 그 결과를 책임자에게 보고하여야 한다. 개인정보의 오·남용이나 유출 목적으로 다운로드 한 것이 확인되었다면 관계 법령에 따라 유출 신고, 정보주체 통지 등을 이행하여야 하며, 개인정보를 회수하는 등 조치를 취하여야 한다."
  laws:
    common:
    - "정보통신기반 보호법 제10조(보호지침)"
    - "개인정보 보호법 제29조(안전조치의무)"
    - "개인정보의 안전성 확보조치 기준 제8조(접속기록의 보관 및 점검)"
    public:
    - "국가 정보보안 기본지침 제55조(로그기록 유지)"
    finance:
    - "전자금융거래법 제21조(안전성의 확보의무)"
    - "전자금융감독규정 제14조(정보처리시스템 보호대책)"
    ict:
    - "정보보호 및 개인정보보호 관리체계 인증 등에 관한 고시 [별표7] 2.9.5 로그 및 접속기록 점검"
  checklist:
  - 로그 검토 및 모니터링 절차
  - 로그 검토 및 모니터링 결과(검토 내역, 보고서 등)
  - 개인정보 접속기록 점검 내역
  - 개인정보 다운로드 시 사유 확인 기준 및 결과
  - 이상징후 발견 시 대응 증적
  - 로그 및 모니터링 결과의 책임자 보고 및 검토 이력
  domain: 12. 보안관리
- id: A-76
  title: "정보나 매체가 용도 폐기되기 위한 폐기 방법 수립‧이행"
  related_org: "정보보호 부서"
  description:
  - "정보나 매체의 용도 폐기 사유가 발생한 경우, 복구나 재생이 불가능하도록 안전한 폐기 절차를 수립하고 이행하여야 한다."
  - "종이 등의 기록물, 인쇄물, 복사물 등은 파쇄 또는 소각하여 폐기하고, 전산자료는 전용 소자 장비(예: 이레이저 또는 디가우저)를 이용하여 데이터가 복원되지 않도록 파기하여야 한다."
  - "자체적으로 정보 및 매체를 폐기할 경우, 관리대장을 통해 폐기 이력(폐기일자, 폐기 담당자 및 책임자 서명, 폐기방법, 폐기확인증적 등)을 기록하여야 한다."
  - "외부업체를 통하여 정보 및 매체를 폐기할 경우, 폐기 절차와 관련된 내용을 계약서에 명시하고, 폐기 절차가 제대로 이행되는지 감독하여야 한다. 또한, 완전한 폐기를 증명하는 증적(예: 사진, 동영상 등)을 보관하여야 한다."
  considerations:
  - |
    이레이저(Eraser)와 디가우저(Degausser)의 개념의 차이점은 다음과 같다.
    | 구분 | 이레이저(Eraser) | 디가우저(Degausser) |
    | --- | --- | --- |
    | 정의 | 저장매체의 데이터를 수회 삭제 및 덮어쓰기를 반복하면서 원 데이터를 복원 불가능한 수준으로 완전삭제하는 장비(또는 S/W)를 의미 | 강력한 자기장을 이용하여 하드디스크 등의 저장 장치에 기록된 데이터를 파괴하는 장비를 의미 |
    | 목적 | 재사용 목적 | 폐기(재사용 불가) 목적 |
  - |
    저장매체를 폐기할 때는 물리적 및 전자적으로 완전히 파괴하고, 재사용할 때는 완전 포맷을 통해 모든 정보를 삭제하여야 한다. 저장매체별·자료별 차별화된 삭제 방법을 다음 분류에 따른 기준 이상으로 적용하여야 한다.
    | 저장매체\저장자료 | 공개자료 | 비공개 자료 | 대외비 자료 | 비밀 자료 |
    | --- | --- | --- | --- | --- |
    | 자기테이프 플로피디스크 | 자체 판단 | 물리적 파괴 | 물리적 파괴 | 물리적 파괴 |
    | 광디스크(CDㆍDVD 등) | 자체 판단 | 물리적 파괴 | 물리적 파괴 | 물리적 파괴 |
    | 반도체메모리(SSDㆍUSB 등) | 포맷 또는 삭제 | 완전삭제 제품 | 물리적 파괴 | 물리적 파괴 |
    | 하드디스크 | 포맷 또는 삭제 | 디가우징 또는 완전삭제 제품 | 물리적 파괴 | 물리적 파괴 |
  laws:
    common:
    - 정보통신기반 보호법 제10조(보호지침)
    - 개인정보 보호법 제21조(개인정보의 파기), 제29조(안전조치의무)
    - 개인정보의 안전성 확보조치 기준 제13조(개인정보의 파기)
    public:
    - 국가 정보보안 기본지침 제61조(저장매체 불용처리)
    finance:
    - 전자금융거래법 제21조(안전성의 확보의무)
    - 전자금융감독규정 제13조(전산자료 보호대책)
    ict:
    - 정보보호 및 개인정보보호 관리체계 인증 등에 관한 고시 [별표7] 2.9.7 자산의 재사용 및 폐기
  checklist:
  - 정보 또는 저장매체의 폐기 방법 및 지침
  - '종이 또는 저장매체에 대한 폐기 기록 및 증빙(예: 요청, 승인, 수행 이력)'
  - (해당하는 경우) 보안 폐기 외주용역 계약서, 폐기 확인서
  domain: 12. 보안관리
- id: A-77
  title: "보안규정의 이행여부를 확인하는 주기적인 보안점검 및 불시 보안점검 수행"
  related_org: "정보보호 부서"
  description:
  - "보안규정의 이행여부를 확인하기 위해 연 1회 이상 주기적으로 보안점검을 수행하여야 한다."
  - "보안규정에 따른 임직원 보안업무 생활화 이행여부를 확인하기 위해 불시 보안점검(생활보안 점검)을 수행하여야 한다."
  - "연 1회 이상 수행하는 보안점검은 내부 보안규정과 관리적·물리적 취약점 점검항목을 고려하여 수행하고, 발견된 문제점은 정보보호책임자(정보보안담당관)에게 보고하여야 한다."
  - "보안점검 완료 후, 보완이 필요한 사항에 대해 조치계획을 수립하고, 조치 완료 여부를 점검하여야 한다."
  considerations:
  - "정보보호 및 개인정보보호 관리체계(ISMS-P) 인증과 같은 대외 보안인증을 유지하는 경우, 해당 인증기준에 주요정보통신기반시설 보호지침에 따른 관리적·물리적 취약점 점검항목(보안인증 기준에 따른 내부 보안감사도 주기적인 보안점검으로 인정)을 포함하여 수행할 필요가 있다."
  - |
    보안규정의 이행여부를 확인하기 위하여 점검기준, 범위, 점검인력, 자격요건 등 점검계획을 수립하고 정보보호책임자에게 보고하여야 한다.
    - 점검기준 : 조직내부에서 수립한 보안 규정
    - 점검범위 : 전사 또는 기반시설 범위 포함
    - 점검주기 : 최소 연 1회 이상 수행 필요
    - 점검인력 자격요건 : 점검의 객관성, 독립성 및 전문성을 확보할 수 있도록 자격 요건 정의
