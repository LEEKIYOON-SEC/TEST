  - "암호키가 손상되거나 손실된 경우, 시스템 또는 암호화된 정보의 복구를 위하여 암호키는 별도의 매체에 저장한 후, 물리적으로 안전한 장소(암호키 관리시스템, 물리적 분리된 곳 등)에 보관하여야 한다."
  - "암호키 복구 및 관리 절차는 정기적으로 검토하고 업데이트하여 최신 보안 기준에 부합하도록 유지하여야 한다."
