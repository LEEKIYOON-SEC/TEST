  - 차단 시스템을 구축하는 등 보안대책을 수립·시행하여야 한다.
  - PC, 노트북 등의 정보시스템에 바이러스, 웜, 트로이목마, 랜섬웨어 등의 악성코드가 감염되지 않도록
  - 백신프로그램 등을 설치·운영하여야 하며 최신의 상태로 유지하기 위해 주기적으로 업데이트를 수행하여야
  - 한다.
  - 바이러스, 악성코드 등 이상징후가 발견되는 경우 이용자에게 통지하고 사용 중지 및 격리 조치를 수행하여야한다.
  considerations:
