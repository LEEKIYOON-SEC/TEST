  - 시 신속히 복구할 수 있도록 백업 대상, 주기, 방법, 보관 장소, 보관기간, 소산 등을 고려하여 백업 절차를
  - 수립·이행하여야 한다.
  - 중요정보가 저장된 백업매체는 운영 중인 정보시스템 또는 백업시스템이 위치한 장소로부터, 물리적으로
  - 떨어진 장소에 소산하여야 한다.
