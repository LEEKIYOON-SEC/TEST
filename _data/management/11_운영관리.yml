  - 수립하여야 한다.
  - 정보시스템 장애를 즉시 인지하고 신속하게 대응하기 위하여 장애탐지, 장애기록, 장애분석, 장애복구,
  - 장애보고 등의 사항을 포함하는 시스템 장애관리 지침을 수립하여야 한다.
  - 장애관리 지침은 장애처리 및 관리를 위한 업무시스템의 변경에 따라 개정될 수 있으므로 주기적인 제·개정에
  - 대한 관리를 하여야 한다.
