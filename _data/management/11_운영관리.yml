  - 수행하여야 한다.
  - '- 복구테스트 계획(복구테스트 주기 및 시점, 담당자, 방법 등)'
  - '- 복구테스트 시나리오 수립'
  - '- 복구테스트 실시 및 결과 보고'
  - '- 복구테스트 결과 문제점 발견 시 개선계획 수립 및 이행'
