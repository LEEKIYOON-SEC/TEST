platform: "8. DBMS"
platform_number: 8
items:
  - id: "D-01"
    title: "기본 계정의 비밀번호, 정책 등을 변경하여 사용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "DBMS 기본 계정의 초기 비밀번호 및 권한 정책을 변경하여 사용하는지 점검"
      check_purpose: "DBMS 기본 계정의 초기 비밀번호 및 권한 정책 변경 사용 유무를 점검하여 비인가자의 초기 비밀번호 대입 공격을 차단하고 있는지 확인하기 위함"
      threat: "DBMS 기본 계정 초기 비밀번호 및 권한 정책을 변경하지 않을 경우 비인가자가 인터넷 통해 DBMS 기본 계정의 초기 비밀번호를 획득하여 초기 비밀번호를 그대로 사용하고 있는 DB에 접근하여 기본 계정에 부여된 권한의 취약점을 이용하여 DB 정보를 유출할 수 있는 위험이 존재함"
      reference:
        - "※ 기본 계정: DB 설치 후 초기에 기본으로 생성되어있는 DBMS 관리용 계정(예 : sa)"
    criteria:
      good: "기본 계정의 초기 비밀번호를 변경하거나 잠금설정한 경우"
      vulnerable: "기본 계정의 초기 비밀번호 를 변경하지 않거나 잠금설정을 하지 않은 경우"
    action: "기본(관리자) 계정의 초기 비밀번호 및 권한 정책 변경"
    impact: "불필요한 기본 계정의 사용 제한"
    examples:
      - os: "Oracle DB"
        content: |
          [기본 계정 비밀번호 변경]
          Step 1) 기본 계정 사용 여부 및 정책 확인
          SQL> SELECT USERNAME, ACCOUNT_STATUS, PROFILE FROM DBA_USERS;
          Step 2) 사용되는 계정의 경우 비밀번호 변경 후 사용
          SQL> ALTER USER <기본 계정명> IDENTIFIED BY <신규 비밀번호>;

          [기본 계정 잠금 설정]
          Step 1) 활성화 되어 있는 기본 계정 확인
          SQL> SELECT USERNAME, ACCOUNT_STATUS, PROFILE FROM DBA_USERS;
          Step 2) 활성화 되어 있는 기본 계정 잠금 설정
          SQL> SELECT username, account_status, lock_date, expiry_date, profile FROM dba_users WHERE account_status ='OPEN';
          ALTER USER <기본 계정명> ACCLUNT LOCK;

          ※ Oracle DB 기본 계정 정보

          | User | Password | User | Password |
          |---|---|---|---|
          | scott | tiger or tigger | system | manager |
          | dbsnmp | dbsnmp | sys | changeon_install |
          | tracesvr | trace | outln | outln |
          | ordplugins | ordplugins | ordsys | ordsys |
          | ctxsys | ctxsys | mdsys | mdsys |
          | adams | wood | blake | papr |
          | clark | clth | jones | steel |
          | lbacsys | lbacsys | - | - |
      - os: "MSSQL"
        content: |
          Step 1) sa 계정 비밀번호 변경
          ALTER LOGIN sa WITH PASSWORD = '신규 비밀번호';

          [sa 계정 비밀번호 변경]

          Step 2) 비밀번호 정책 강제 사용 적용
      - os: "MySQL"
        content: |
          Step 1) root 계정 비밀번호 변경
          [mysql 5.7]
          mysql> UPDATE user SET authentication_string = PASSWORD('신규 비밀번호') WHERE User = 'root';
          mysql> flush privileges;

          [mysql 8.0]
          mysql> ALTER USER 'root'@'localhost' IDENTIFIED BY '신규 비밀번호';
          mysql> flush privileges;
      - os: "Altibase"
        content: |
          Step 1) 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) ALTER USER 명령어로 비밀번호 변경
          Altibase 서버에 sys 유저로 접속 후 ALTER USER 명령어로 비밀번호를 변경
          ALTER USER sys IDENTIFIED BY [신규 비밀번호];
          또는
          altipasswd 명령어로 비밀번호 변경(Altibase 서버 온라인 상태에서 수행)
          $ altipasswd
          Previous Password : old_password
          New Password : new_password
          Retype New Password : new_password
      - os: "Tibero"
        content: |
          Step 1) sys 계정 비밀번호 변경
          ALTER USER sys IDENTIFIED BY [신규 비밀번호];
      - os: "PostgreSQL"
        content: |
          Step 1) postgres 계정으로 접속 계정 변경 및 접속
          $ sudo –u postgres psql
          # ALTER USER postgres WITH PASSWORD '신규 비밀번호';
          # \q
      - os: "Cubrid"
        content: |
          Step 1) 사용자 계정 비밀번호 사용 여부 확인
          csql> SELECT name, password FROM db_user;
          csql> SELECT * FROM db_password;
          Step 2) 사용자 계정 비밀번호 변경
          csql> ALTER USER "사용자 계정명" PASSWORD '신규 비밀번호';

          ※ 비밀번호가 취약하게 설정된 경우 비밀번호를 다음 기준을 준수하여 변경함
          < 비밀번호 관리 방법 >
          1. 영문, 숫자, 특수문자를 조합하여 계정명과 상이한 8자 이상의 비밀번호 설정
          다음의 문자 종류 중 2가지 종류 이상을 조합하여 최소 10자리 이상 또는, 3가지 종류 이상을 조합하여 최소 8자리 이상의 길이로 구성
          1) 영문 대문자(26개)
          2) 영문 소문자(26개)
          3) 숫자(10개)
          4) 특수문자(32개)
          2. 시스템마다 상이한 비밀번호 사용
          3. 비밀번호를 기록해 놓을 경우 변형하여 기록
          4. 가급적 자주 비밀번호를 변경

  - id: "D-02"
    title: "데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "DBMS에 존재하는 계정 중 DB 관리나 운용에 사용하지 않는 불필요한 계정이 존재하는지 점검"
      check_purpose: "불필요한 계정 존재 유무를 점검하여 불필요한 계정 정보(비밀번호)의 유출 시 발생할 수 있는 비인가자의 DB 접근에 대비되어 있는지 확인하기 위함"
      threat: "DB 관리나 운용에 사용하지 않는 불필요한 계정이 존재할 경우, 비인가자가 불필요한 계정을 이용하여 DB에 접근하여 데이터를 열람, 삭제, 수정할 위험이 존재함"
      reference:
        - "※ 불필요한 계정: SCOTT, PM, ADAMS, CLARK 등의 Demonstration 계정 및 퇴사나 직무 변경 등으로 더 이상 사용하지 않는 계정"
    criteria:
      good: "계정 정보를 확인하여 불필요한 계정이 없는 경우"
      vulnerable: "인가되지 않은 계정, 퇴직자 계정, 테스트 계정 등 불필요한 계정이 존재하는 경우"
    action: "계정별 용도를 파악한 후 불필요한 계정 삭제"
    impact: "Demonstration 계정 / Object 사용 불가 / 삭제된 계정 사용 불가"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 불필요한 계정 및 Object 삭제
          SQL> DROP USER [삭제할 계정];
      - os: "MSSQL"
        content: |
          Step 1) 불필요한 계정 삭제
          EXEC sp_droplogin '삭제할 계정';
      - os: "MySQL"
        content: |
          Step 1) 불필요한 계정 삭제
          DROP USER '삭제할 계정'@'호스트명 or IP';
          FLUSH PRIVILEGES;
      - os: "Altibase"
        content: |
          Step 1) 모든 사용자 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 불필요한 계정 삭제
          DROP USER user_name CASCADE;
      - os: "Tibero"
        content: |
          Step 1) 모든 사용자 확인
          Tibero에서는 사용자의 정보를 제공하기 위해 아래 나열된 정적 뷰를 제공하고 있으며, DBA나 일반 사용자 모두 사용할 수 있다.
          SELECT * FROM all_users;
          SELECT * FROM dba_users;
          SELECT * FROM user_users;

          | 정적 뷰 | 설명 |
          |---|---|
          | ALL_USERS | 데이터베이스의 모든 사용자의 기본적인 정보를 조회하는 뷰 |
          | DBA_USERS | 데이터베이스의 모든 사용자의 자세한 정보를 조회하는 뷰 |
          | USER_USERS | 현재 사용자의 정보를 조회하는 뷰 |

          Step 2) 불필요한 계정 삭제
          DROP USER user_name CASCADE;
      - os: "PostgreSQL"
        content: |
          Step 1) 모든 사용자 확인
          쿼리문 조회 : SELECT * FROM system_.sys_users_;
          명령어 조회 : \du
          Step 2) 불필요한 계정 삭제
          DROP ROLE '삭제할 계정';
      - os: "Cubrid"
        content: |
          Step 1) 사용자 계정 목록 확인
          csql> SELECT name, password FROM db_user;
          Step 2) 불필요한 계정 삭제
          csql> DROP USER [삭제할 계정];

  - id: "D-03"
    title: "비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용되어 있는지 점검"
      check_purpose: "비밀번호 사용 기간 및 복잡도 설정 유무를 점검하여 비인가자의 비밀번호 추측 공격(무차별 대입 공격, 사전 대입 공격 등)에 대한 대비가 되어있는지 확인하기 위함"
      threat: "비밀번호 사용 기간 및 복잡도 설정이 되어있지 않으면 비인가자가 비밀번호 추측 공격을 통해 획득한 계정의 비밀번호를 이용하여 DB에 접근할 수 있는 위험이 존재함"
      reference:
        - "※ 무차별 대입 공격(Brute Force Attack): 특정 암호를 해독하기 위해 가능한 모든 값을 대입하는 공격 방법"
        - "※ 사전 대입 공격(Dictionary Attack): 사전에 있는 단어를 입력하여 비밀번호를 알아내거나 암호를 해독하는데 사용되는 컴퓨터 공격 방법"
    criteria:
      good: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용된 경우"
      vulnerable: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용되지 않은 경우"
    action: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 정책 설정"
    impact: "주기적인 비밀번호 변경 필요"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) PASSWORD_LIFE_TIME Profile 파라미터 변경
          SQL> ALTER PROFILE <프로파일명> LIMIT PASSWORD_LIFE_TIME xx;
          Step 2) Profile 값과 관련된 사용자 변경
          SQL> ALTER PROFILE <계정명> PROFILE <변경할 프로파일명>;
          Step 3) 비밀번호 정책 설정 변경
          SQL> ALTER PROFILE <프로파일명> LIMIT
          FAILED_LOGIN_ATTEMPTS 3 (비밀번호 실패 3번 까지만 가능)
          PASSWORD_LIFE_TIME 30 (30일 동안만 비밀번호 사용 가능
          PASSWORD_REUSE_TIME 30 (사용한 비밀번호 30일 후부터 재사용 가능)
          PASSWORD_VERIFY_FUNCTION verify_function (비밀번호 복잡성 검증)
          PASSWORD_GRACE_TIME 5; (life time이 끝나고 5일 동안 메시지를 보여줌)
      - os: "MSSQL"
        content: |
          Step 1) 비밀번호 변경 주기는 '암호 만료 강제 적용'을 적용함으로써 주기적으로 변경할 수 있으며, 변경 기간은 OS의 '암호 정책'에서 적용받으므로 '암호 정책 > 최대 암호 사용 기간' 설정도 변경해야 함
          Step 2) 암호 만료 강제 적용
          보안 > 로그인 > 각 로그인 계정 > 속성 > "암호 만료 강제 적용" 설정

          [암호 만료 강제 적용 설정]

          Step 3) OS 암호 정책 설정
          [관리 도구] > [로컬 보안 정책] > [보안 설정] > [계정 정책] > [암호 정책] > 최대 암호 사용 기간 : '60일' 설정

          [최대 암호 사용 기간 설정]
      - os: "MySQL"
        content: |
          [비밀번호 복잡도 정책 설정]
          Step 1) 비밀번호 정책 확인
          mysql> SHOW VARIABLES LIKE 'validate_password%';
          ※ component_validate_password가 설치되어 있지 않은 경우 아래와 같이 해당 컴포넌트 설치
          mysql> INSTALL COMPONENT 'file://component_validate_password';
          Step 2) 비밀번호 정책 설정
          다음과 같은 방법으로 각각의 비밀번호 정책을 설정
          SET GLOBAL validate_password.policy = 'MEDIUM';
          (비밀번호 정책의 강도 LOW/MEDIUM/STRONG)
          SET GLOBAL validate_password.length = 8; (비밀번호 최소 길이)
          SET GLOBAL validate_password.mixed_case_count = 1; (포함되어야 하는 영문 대소문자 최소 개수)
          SET GLOBAL validate_password.number_count = 1; (포함되어야 하는 숫자 최소 개수)
          SET GLOBAL validate_password.special_char_count = 1; (포함되어야 하는 특수문자 최소 개수)

          ※ Linux계열(/etc/my.cnf 또는 /etc/mysql/my.cnf), Windows(C:\ProgramData\MySQL\MySQL Server <설치된 버전>\my.ini)의 <mysqld> 섹션에 설정을 추가하여 정책 설정 가능
          ※ 비밀번호 신규 적용 및 초기화 시 설정 규칙에 맞추어 관리하고, 저장 시에는 일방향 암호화 알고리즘을 통해 암호화 처리(One-Way Encryption)함

          [비밀번호 LifeTime 정책 적용]
          Step 1) 비밀번호 정책 확인
          mysql> SHOW VARIABLES LIKE 'default_password_lifetime';
          Step 2) 비밀번호 LifeTime 설정
          mysql> SET GLOBAL default_password_lifetime=90;
          ※ 기본 값
          - 5.7.11 이전 버전 : 0
          - 5.7.11 이후 버전  및 8.0 이후 버전 : 360
          Step 3) 정책 적용전에 생성된 계정의 LifeTime 변경
          mysql> ALTER USER <계정명>'@'<호스트명 or IP>' PASSWORD EXPIRE INTERVAL 91 DAY;
      - os: "Altibase"
        content: |
          Step 1) 다음 명령어를 통해 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 아래 Property에 대해 비밀번호 정책 설정
          CASE_SENSITIVE_PASSWORD = 1
          FAILED_LOGIN_ATTEMPTS
          PASSWORD_LOCK_TIME
          PASSWORD_LIFE_TIME
          PASSWORD_GRACE_TIME
          PASSWORD_REUSE_TIME
          PASSWORD_REUSE_MAX
          PASSWORD_VERIFY_FUNCTION

          정책 적용 시 다음 명령어를 사용
          ALTER USER 계정명 LIMIT (Property 숫자);
          예시) ALTER USER TESTUSER LIMIT (FAILED_LOGIN_ATTEMPTS 7, PASSWORD_LOCK_TIME 7);
      - os: "Tibero"
        content: |
          Step 1) 사용자별 비밀번호 PROFILE 적용 여부 확인
          비밀번호 설정 규칙에 맞추어 비밀번호를 설정할 수 있도록 시스템 차원에서 기능 제공
          SELECT * FROM dba_users;

          [사용자별 비밀번호 PROFILE 적용 여부 확인]

          Step 2) 설정되어 있을 경우 PROFILE 설정 내용 확인
          SELECT * FROM dba_profiles;

          [PROFILE 설정 내용 확인]

          Step 3) 설정되어 있지 않을 경우 PROFILE 생성 또는 수정 시(ALTER PROFILE) 비밀번호 정책 설정 적용 시 다음 명령어를 사용
          CREATE PROFILE prof LIMIT
          예시) CREATE PROFILE prof LIMIT
          failed_login_attempts 3
          password_lock_time 1/1440
          password_life_time 90
          password_reuse_time unlimited
          password_reuse_max 10
          password_grace_time 10
          password_verify_function verify_function;

  - id: "D-06"
    title: "DB 사용자 계정을 개별적으로 부여하여 사용"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "DB 접근 시 사용자별로 서로 다른 계정을 사용하여 접근하는지 점검"
      check_purpose: "사용자별 별도 DBMS 계정을 사용하여 DB에 접근하는지 점검하여 DB 계정 공유 사용으로 발생할 수 있는 로그 감사 추적 문제를 대비하고자 함"
      threat: "DB 계정을 공유하여 사용할 경우 비인가자의 DB 접근 발생 시 계정 공유 사용으로 인해 로그 감사 추적의 어려움이 발생할 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "사용자별 계정을 사용하고 있는 경우"
      vulnerable: "공용 계정을 사용하고 있는 경우"
    action: "사용자별 계정 생성 및 권한 부여"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 계정 확인(SQL*Plus)
          SQL> SELECT username FROM dba_users ORDER BY username;
          Step 2) 공용 계정 삭제
          SQL> DROP USER '공용 계정';
          Step 3) 사용자별, 응용 프로그램별 계정 생성
          SQL> CREATE USER '<계정명>' IDENTIFIED BY '<비밀번호>';
          Step 4) 권한 부여
          SQL> GRANT connect, resource TO [계정명];
      - os: "MSSQL"
        content: |
          Step 1) 공용계정 삭제
          EXEC sp_droplogin '공용 계정';
          Step 2) 사용자별, 응용 프로그램별 계정 생성
          CREATE LOGIN '생성 계정' WITH PASSWORD = '비밀번호';
          CREATE USER '생성 계정' FOR LOGIN '생성 계정' WITH DEFAULT_SCHEMA ='생성 계정';
          ALTER USER '생성 계정';
          EXEC sp_adduser '생성 계정', '생성 계정', 'db_owner';
          EXEC sp_adduser '생성 계정', '생성 계정', '생성 계정';
          EXEC sp_grantdbaccess '생성 계정', '생성 계정';
      - os: "MySQL"
        content: |
          Step 1) 공용용 계정 삭제
          mysql> DROP USER <계정명>@<호스트명 or IP>
          Step 2) 사용자별, 응용 프로그램별 계정 생성 및 권한 설정
          // 사용자 계정 생성
          mysql> create user '<계정명>'@'<호스트명 or IP>' identified by '비밀번호';
          // 특정 데이터베이스의 특정 테이블에 select, insert 권한을 부여
          mysql> grant select, insert on DB이름.테이블명 to '<계정명>'@'<호스트명 or IP>';
          // 특정 데이터베이스의 모든 테이블에 모든 권한을 부여
          mysql> grant all privileges on DB이름.* to '<계정명>'@'<호스트명 or IP>';
          mysql> flush privileges;
          ※ 모든 권한을 부여할 경우, 해당 사용자는 지정된 데이터베이스에서 모든 작업의 수행이 가능하므로 사용자의 관리적 측면에서는 편리하나, 보안적 측면에서는 필요한 최소한의 권한만 부여하여 안정성을 높여야 함
      - os: "Altibase"
        content: |
          Step 1) DB에 생성된 계정 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 공용 계정 확인하여 삭제
          DROP USER <계정명> CASCADE;
          Step 3) 사용자별, 응용 프로그램별 등 목적에 맞게 계정 생성
          CREATE USER <계정명> IDENTIFIED BY <비밀번호>;
      - os: "Tibero"
        content: |
          Step 1) DB에 생성된 계정 확인
          SELECT * FROM dba_users_;
          Step 2) Step1)의 결과에서 공용 계정 확인하여 삭제
          DROP USER [삭제할 계정] CASCADE;
          Step 3) 사용자별, 응용 프로그램별 등 목적에 맞게 계정 생성
          CREATE USER [계정명] IDENTIFIED BY [비밀번호];
      - os: "PostgreSQL"
        content: |
          Step 1) 모든 사용자 확인
          쿼리문 조회 : SELECT * FROM pg_shadow;
          명령어 조회 : \du
          Step 2) 불필요 계정 삭제
          DROP ROLE '삭제할 계정';
          Step 3) 계정 생성 및 권한 추가
          CREATE USER '생성할 계정';
          ALTER ROLE '계정명' '권한명' '권한명' ····;
          \du (계정 생성 및 권한 확인)

          ※ 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
  - id: "D-04"
    title: "데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한을 부여하였는지 점검"
      check_purpose: "관리자 권한이 필요한 계정과 그룹에만 관리자 권한을 부여하였는지 점검하여 관리자 권한의 남용을 방지하여 계정 유출로 인한 비인가자의 DB 접근 가능성을 최소화하고자 함"
      threat: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한을 부여하지 않으면 관리자 권한이 부여된 계정이 비인가자에게 유출될 경우 DB에 접근할 수 있는 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한이 부여된 경우"
      vulnerable: "관리자 권한이 필요 없는 계정 및 그룹에 관리자 권한이 부여된 경우"
    action: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한 부여"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) SYSDBA 권한 점검
          SQL> SELECT username FROM v$pwfile_users WHERE username NOT IN (SELECT grantee FROM dba_role_privs WHERE granted_role='DBA') AND username != 'INTERNAL' AND SYSDBA = 'TRUE';
          (어떠한 계정이라도 나오는 경우 취약)
          Step 2) Admin에 부적합 계정 존재 여부 점검
          SQL> SELECT grantee, privilege FROM dba_sys_privs WHERE grantee NOT IN ('SYS', 'SYSTEM', 'AQ_ADMINISTRATOR_ROLE', 'DBA', 'DSYS', 'BACSYS', 'HEDULER_ADMIN', 'MSYS') AND admin_option= 'YES' AND grantee NOT IN (SELECT grantee FROM dba_role_privs WHERE granted_role='DBA');
          (어떠한 계정이라도 나오는 경우 취약)
          Step 3) 관리자 권한이 불필요한 계정에서 관련 권한을 제거
          SELECT * FROM DBA_SYS_PRIVS WHERE GRANTEE = '계정명';
          불필요하게 시스템 권한을 부여한 계정의 권한 변경 필요
          REVOKE <권한> FROM <계정명>;
          시스템 권한 부여가 필요한 경우 필요한 테이블별 권한 부여
          GRANT <권한> ON <테이블명> TO <계정명>;
          인가된 사용자는 관리자 권한에 role을 grant한 후, 시스템 권한을 grant하고 role을 인가된 사용자에게 grant 함
          GRANT <Role_name> TO <계정명>;
      - os: "MSSQL"
        content: |
          Step 1) sysadmin서버 역할의 계정 목록을 확인 후 서버 역할에 불필요한 계정이 있는 경우 서버 역할에서 삭제
          EXEC sp_droprolemember 'user_name', 'sysadmin';
          예시) EXEC sp_dropsrvrolemember 'user01', 'sysadmin'; (user01계정을 sysadmin서버 역할에서 삭제)

          [서버 역할에서 불필요 계정 삭제 예시]
      - os: "MySQL"
        content: |
          Step 1) SUPER 권한(관리자 권한)이 부여되어 있는 계정 확인
          SELECT GRANTEE FROM INFORMATION_SCHEMA.USER_PRIVILEGES WHERE PRIVILEGE_TYPE = 'SUPER';
          Step 2) 불필요하게 SUPER 권한이 부여되어 있는 계정에 대해 SUPER 권한 회수
          REVOKE SUPER ON *.* FROM '<계정명>';
          FLUSH PRIVILEGES;
          ※ 만약 관리자 'test'@'localhost' 계정이 바이너리 로그 정리 및 시스템 변수 수정을 위해 SUPER 권한을 필요로 하는 경우 아래와 같은 명령문으로 필요한 권한으로 제한.
          GRANT BINLOG_ADMIN, SYSTEM_VARIABLES_ADMIN ON *.* TO 'test'@'localhost';
          REVOKE SUPER ON *.* FROM 'test'@'localhost';
          FLUSH PRIVILEGES;
      - os: "Altibase"
        content: |
          Step 3) 계정별 부여된 시스템 권한 목록에서 grantee 확인
          SELECT grantee_id FROM system_.sys_grant_system_;
          Step 4) 계정별 부여된 시스템 권한 목록에서 user_id 확인
          SELECT user_id, user_name FROM system_.sys_users_;
          Step 5) 계정별 부여된 시스템 권한 목록에서 priv_id 확인
          SELECT priv_id, priv_name FROM system_.sys_privileges_;
          Step 6) 일반 사용자 계정 생성 시 시스템에 의해 부여되는 기본 권한 외 입력된 경우 해당 권한 삭제

          시스템에 의해 자동으로 부여되는 권한

          | 권한 | privileged_id |
          |---|---|
          | create session | 215 |
          | create table | 217 |
          | create sequence | 210 |
          | create procedure | 205 |
          | create view | 229 |
          | create trigger | 241 |
          | create synonym | 245 |
          | create materialized view | 252 |
          | create library | 256 |
      - os: "Tibero"
        content: |
          Step 1) 계정별 부여된 시스템 권한 목록 확인 후, 아래 명령어 모두 입력
          SELECT * FROM dba_users;
          SELECT * FROM dba_sys_privs;
          Step 2) dba_users 결과값에서 시스템 계정, 일반 계정 확인

          [시스템 계정, 일반 계정 확인]

          Step 3) dba_sys_privs 결과값에서 일반 계정임에도 시스템 권한을 불필요하게 부여받고 있는지 확인

          [일반 계정 권한 불필요하게 부여되어 있는지 확인]

          Step 4) 일반 계정에 불필요한 시스템 권한이 부여된 경우 권한 삭제
      - os: "PostgreSQL"
        content: |
          Step 1) 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
          모든 사용자 확인
          쿼리문 조회 : SELECT * FROM pg_user; or SELECT username, usesuper FROM pg_shadow;
          명령어 조회 : \du
          Step 2) 불필요하게 관리자 권한이 부여된 경우 권한 회수
          ALTER ROLE <계정명> NOSUPERUSER;
          ALTER ROLE <계정명> NOCREATEROLE;
          ALTER ROLE <계정명> NOCREATEDB;
          ALTER ROLE <계정명> NOREPLICATION;
          ALTER ROLE <계정명> NOBYPASSRLS;
      - os: "Cubrid"
        content: |
          Step 1) 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
          Step 2) DBA 권한을 가진 사용자 계정 확인
          SELECT a.name FROM db_user a, table(direct_groups) AS t(roles) WHERE roles.name = 'DBA';
          DBA 권한을 가진 사용자 중 권한이 불필요한 계정의 권한 회수 or 계정 삭제
          1.  DBA가 가진 권한 한 번에 회수
          REVOKE ALL PRIVILEGES ON test FROM 'GRANT_TEST';
          2. DBA가 가진 권한을 명시적으로 회수
          REVOKE SELECT ON test FROM 'GRANT_TEST';
          REVOKE INSERT ON test FROM 'GRANT_TEST';
          REVOKE UPDATE ON test FROM 'GRANT_TEST';
          REVOKE DELETE ON test FROM 'GRANT_TEST';
          REVOKE ALTER ON test FROM 'GRANT_TEST';
          REVOKE DROP ON test FROM 'GRANT_TEST';
          REVOKE EXECUTE ON test FROM 'GRANT_TEST';
          REVOKE INDEX ON test FROM 'GRANT_TEST';
          REVOKE REFERENCES ON test FROM 'GRANT_TEST';
          3. DBA 권한을 가진 불필요 계정 삭제
          DROP USER 'GRANT_TEST';
          Step 3) 필요할 경우 적절한 권한을 부여하여 새로운 계정 생성
          CREATE USER [계정명] PASSWORD '비밀번호' GROUPS [그룹명];
          예시) CREATE USER test_db PASSWORD 'password' GROUPS DB_USER;

  - id: "D-05"
    title: "비밀번호 재사용에 대한 제약 설정"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, Altibase, Tibero 등"
    description:
      check_content: "비밀번호 변경 시 이전 비밀번호를 재사용할 수 없도록 비밀번호 제약 설정이 되어있는지 점검"
      check_purpose: "비밀번호 재사용 제약 설정 적용 여부를 점검하여 비밀번호 변경 시 이전 비밀번호 재사용을 제약하여 형식적인 비밀번호 변경을 원천적으로 차단하기 위함"
      threat: "비밀번호 재사용 제약 설정이 적용되어 있지 않을 경우 비밀번호 변경 전 사용했던 비밀번호를 재사용함으로써 비인가자의 계정 비밀번호 추측 공격에 대한 시간을 더 많이 허용하여 비밀번호 유출 위험이 증가함"
      reference:
        - "※ 비밀번호 제약 설정: 비밀번호 변경 시 이전에 사용했던 비밀번호를 재사용할 수 없게 하는 설정으로써 이전 암호 재사용 가능 기간(PASSWORD_REUSE_TIME), 이전 암호 재사용 가능 횟수(PASSWORD_REUSE_MAX) 등이 있음"
    criteria:
      good: "비밀번호 재사용 제한 설정을 적용한 경우"
      vulnerable: "비밀번호 재사용 제한 설정을 적용하지 않은 경우"
    action: "PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) SQL*Plus 설정 확인
          -- Check for both reuse max and reuse time not set
          SELECT profile FROM DBA_PROFILES WHERE (resource_name = 'PASSWORD_REUSE_MAX' AND limit IN ('UNLIMITED', 'NULL')) OR (profile IN (SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_TIME') AND limit IN ('UNLIMITED', 'NULL'));

          -- Check for reuse max with value that is less than allowed minimum
          SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_MAX' AND limit NOT IN ('UNLIMITED', 'NULL') AND REGEXP_LIKE(limit, '^[0-9]+$') -- Only consider numeric values AND TO_NUMBER(limit) < 10;

          -- Check for reuse time that is less than allowed minimum
          SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_TIME' AND limit NOT IN ('UNLIMITED', 'NULL') AND REGEXP_LIKE(limit, '^[0-9]+$') -- Only consider numeric values AND TO_NUMBER(limit) < 365;
          Step 2) PASSWORD_REUSE_TIME 및 PROFILE 파라미터 수정
          SQL> ALTER PROFILE default LIMIT password_reuse_time 365 password_reuse_max 10;
          SQL> ALTER PROFILE [프로파일명] LIMIT password_reuse_time DEFAULT password_reuse_max default;
      - os: "Altibase"
        content: |
          Step 1) 다음 명령어를 통해 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 아래 Property에 대해 비밀번호 정책 설정
          CASE_SENSITIVE_PASSWORD
          FAILED_LOGIN_ATTEMPTS
          PASSWORD_LOCK_TIME
          PASSWORD_LIFE_TIME
          PASSWORD_GRACE_TIME
          PASSWORD_REUSE_TIME
          PASSWORD_REUSE_MAX
          PASSWORD_VERIFY_FUNCTION

          정책 적용 시 다음 명령어를 사용
          ALTER USER [계정명] LIMIT (Property 숫자);
          예시) ALTER USER TESTUSER LIMIT (FAILED_LOGIN_ATTEMPTS 7, PASSWORD_LOCK_TIME 7);
      - os: "Tibero"
        content: |
          Step 1) 사용자별 비밀번호 PROFILE 적용 여부 확인
          SELECT * FROM dba_users;

          [사용자별 비밀번호 PROFILE 적용 여부 확인]

          Step 2) 설정되어 있을 경우 PROFILE 설정 내용 확인
          SELECT * FROM dba_users;

          [PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터값 확인]

          Step 3) 설정되어 있지 않을 경우 PROFILE 생성 또는 수정 시(ALTER PROFILE) 비밀번호 정책 설정 적용 시 다음 명령어를 사용
          CREATE PROFILE prof LIMIT
          예시) CREATE PROFILE prof LIMIT
          failed_login_attempts 3
          password_lock_time 1/1440
          password_life_time 90
          password_reuse_time unlimited
          password_reuse_max 10
          password_grace_time 10
          password_verify_function verify_function;
  - id: "D-07"
    title: "root 권한으로 서비스 구동 제한"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MySQL, Altibase, Cubrid 등"
    description:
      check_content: "서비스 구동 시 root 계정 또는 root 권한으로 구동되는지 점검"
      check_purpose: "root 권한을 제한적으로 사용함으로써 시스템의 손상, 데이터의 유출 및 변조 등을 차단하여 보안 위협을 방지하기 위함"
      threat: "root 권한으로 서비스를 구동할 경우 시스템 손상, 데이터 유출 및 변조, 감사 및 추적의 어려움 등으로 인해 서비스 공격의 표적이 될 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "DBMS가 root 계정 또는 root 권한이 아닌 별도의 계정 및 권한으로 구동되고 있는 경우"
      vulnerable: "DBMS가 root 계정 또는 root 권한으로 구동되고 있는 경우"
    action: "DBMS 구동 계정 변경"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          $ ps –ef | grep pmon
          Step 2) Oracle Listener 프로세스 사용자 확인
          $ ps –ef | grep tnslsnr
          Step 3) 사용자 계정을 'Oracle'로 전환
          $ su – oracle (현재 사용자/관리자 계정에서 'Oracle' 사용자로 전환)
          $ lsnrctl stop (Oracle Listener 중지)
          $ sqlplus / as sysdba (SQL*Plus 유틸리티를 이용하여 시스템 관리자(SYSDBA) 권한으로 로그인)
          $ shutdown immediate (데이터베이스 종료)
          Step 4) Oracle 서비스 재시작
          $ lsnrctl start (Oracle Listener 시작)
          $ sqlplus / as sysdba (SQL*Plus 유틸리티를 이용하여 시스템 관리자(SYSDBA) 권한으로 로그인)
          $ startup (데이터베이스 시작)
      - os: "MySQL"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | grep mysqld
          Step 2) mysql server configuration 파일에서 [mysqld] 그룹의 'user' 지시자의 설정값 확인
          # cat [mysql server configuration 파일 위치] | grep user (user=mysql로 설정되어 있으면 양호)
          Step 3) mysql server configuration 파일에서 [mysqld] 그룹의 'user' 지시자 설정
          # vi [mysql server configuration 파일 위치] (일반적으로 /etc/my.cnf.d/mysql-server.cnf)
          ※ user = [mysqld를 구동할 시스템의 일반 사용자 계정]
      - os: "Altibase"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | grep altibase | grep –v grep
          Step 2) Altibase 디렉터리 및 파일을 Altibase 전용 계정으로 소유자 변경
          # chown –R [계정명]:[그룹명] '[Altibase 디렉터리 위치]'
          Step 3) Altibase 전용 계정으로 DB 구동
      - os: "Cubrid"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | egrep 'cub_master|cub_broker|cub_manager' | grep –v grep
          (cub_master, cub_broker, cub_manager 데몬이 root 또는 root 권한으로 구동되었는지 확인)
          Step 2) 삭제 후 cubrid 계정으로 재설치 또는 같은 DB를 생성 후에 언로드/로드를 통해 기존 데이터 이관
