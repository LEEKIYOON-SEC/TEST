platform: "8. DBMS"
platform_number: 8
items:
  - id: "D-01"
    title: "기본 계정의 비밀번호, 정책 등을 변경하여 사용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "DBMS 기본 계정의 초기 비밀번호 및 권한 정책을 변경하여 사용하는지 점검"
      check_purpose: "DBMS 기본 계정의 초기 비밀번호 및 권한 정책 변경 사용 유무를 점검하여 비인가자의 초기 비밀번호 대입 공격을 차단하고 있는지 확인하기 위함"
      threat: "DBMS 기본 계정 초기 비밀번호 및 권한 정책을 변경하지 않을 경우 비인가자가 인터넷 통해 DBMS 기본 계정의 초기 비밀번호를 획득하여 초기 비밀번호를 그대로 사용하고 있는 DB에 접근하여 기본 계정에 부여된 권한의 취약점을 이용하여 DB 정보를 유출할 수 있는 위험이 존재함"
      reference:
        - "※ 기본 계정: DB 설치 후 초기에 기본으로 생성되어있는 DBMS 관리용 계정(예 : sa)"
    criteria:
      good: "기본 계정의 초기 비밀번호를 변경하거나 잠금설정한 경우"
      vulnerable: "기본 계정의 초기 비밀번호 를 변경하지 않거나 잠금설정을 하지 않은 경우"
    action: "기본(관리자) 계정의 초기 비밀번호 및 권한 정책 변경"
    impact: "불필요한 기본 계정의 사용 제한"
    examples:
      - os: "Oracle DB"
        content: |
          [기본 계정 비밀번호 변경]
          Step 1) 기본 계정 사용 여부 및 정책 확인
          SQL> SELECT USERNAME, ACCOUNT_STATUS, PROFILE FROM DBA_USERS;
          Step 2) 사용되는 계정의 경우 비밀번호 변경 후 사용
          SQL> ALTER USER <기본 계정명> IDENTIFIED BY <신규 비밀번호>;

          [기본 계정 잠금 설정]
          Step 1) 활성화 되어 있는 기본 계정 확인
          SQL> SELECT USERNAME, ACCOUNT_STATUS, PROFILE FROM DBA_USERS;
          Step 2) 활성화 되어 있는 기본 계정 잠금 설정
          SQL> SELECT username, account_status, lock_date, expiry_date, profile FROM dba_users WHERE account_status ='OPEN';
          ALTER USER <기본 계정명> ACCLUNT LOCK;

          ※ Oracle DB 기본 계정 정보

          | User | Password | User | Password |
          |---|---|---|---|
          | scott | tiger or tigger | system | manager |
          | dbsnmp | dbsnmp | sys | changeon_install |
          | tracesvr | trace | outln | outln |
          | ordplugins | ordplugins | ordsys | ordsys |
          | ctxsys | ctxsys | mdsys | mdsys |
          | adams | wood | blake | papr |
          | clark | clth | jones | steel |
          | lbacsys | lbacsys | - | - |
      - os: "MSSQL"
        content: |
          Step 1) sa 계정 비밀번호 변경
          ALTER LOGIN sa WITH PASSWORD = '신규 비밀번호';

          [sa 계정 비밀번호 변경]

          Step 2) 비밀번호 정책 강제 사용 적용
      - os: "MySQL"
        content: |
          Step 1) root 계정 비밀번호 변경
          [mysql 5.7]
          mysql> UPDATE user SET authentication_string = PASSWORD('신규 비밀번호') WHERE User = 'root';
          mysql> flush privileges;

          [mysql 8.0]
          mysql> ALTER USER 'root'@'localhost' IDENTIFIED BY '신규 비밀번호';
          mysql> flush privileges;
      - os: "Altibase"
        content: |
          Step 1) 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) ALTER USER 명령어로 비밀번호 변경
          Altibase 서버에 sys 유저로 접속 후 ALTER USER 명령어로 비밀번호를 변경
          ALTER USER sys IDENTIFIED BY [신규 비밀번호];
          또는
          altipasswd 명령어로 비밀번호 변경(Altibase 서버 온라인 상태에서 수행)
          $ altipasswd
          Previous Password : old_password
          New Password : new_password
          Retype New Password : new_password
      - os: "Tibero"
        content: |
          Step 1) sys 계정 비밀번호 변경
          ALTER USER sys IDENTIFIED BY [신규 비밀번호];
      - os: "PostgreSQL"
        content: |
          Step 1) postgres 계정으로 접속 계정 변경 및 접속
          $ sudo –u postgres psql
          # ALTER USER postgres WITH PASSWORD '신규 비밀번호';
          # \q
      - os: "Cubrid"
        content: |
          Step 1) 사용자 계정 비밀번호 사용 여부 확인
          csql> SELECT name, password FROM db_user;
          csql> SELECT * FROM db_password;
          Step 2) 사용자 계정 비밀번호 변경
          csql> ALTER USER "사용자 계정명" PASSWORD '신규 비밀번호';

          ※ 비밀번호가 취약하게 설정된 경우 비밀번호를 다음 기준을 준수하여 변경함
          < 비밀번호 관리 방법 >
          1. 영문, 숫자, 특수문자를 조합하여 계정명과 상이한 8자 이상의 비밀번호 설정
          다음의 문자 종류 중 2가지 종류 이상을 조합하여 최소 10자리 이상 또는, 3가지 종류 이상을 조합하여 최소 8자리 이상의 길이로 구성
          1) 영문 대문자(26개)
          2) 영문 소문자(26개)
          3) 숫자(10개)
          4) 특수문자(32개)
          2. 시스템마다 상이한 비밀번호 사용
          3. 비밀번호를 기록해 놓을 경우 변형하여 기록
          4. 가급적 자주 비밀번호를 변경

  - id: "D-02"
    title: "데이터베이스의 불필요 계정을 제거하거나, 잠금설정 후 사용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "DBMS에 존재하는 계정 중 DB 관리나 운용에 사용하지 않는 불필요한 계정이 존재하는지 점검"
      check_purpose: "불필요한 계정 존재 유무를 점검하여 불필요한 계정 정보(비밀번호)의 유출 시 발생할 수 있는 비인가자의 DB 접근에 대비되어 있는지 확인하기 위함"
      threat: "DB 관리나 운용에 사용하지 않는 불필요한 계정이 존재할 경우, 비인가자가 불필요한 계정을 이용하여 DB에 접근하여 데이터를 열람, 삭제, 수정할 위험이 존재함"
      reference:
        - "※ 불필요한 계정: SCOTT, PM, ADAMS, CLARK 등의 Demonstration 계정 및 퇴사나 직무 변경 등으로 더 이상 사용하지 않는 계정"
    criteria:
      good: "계정 정보를 확인하여 불필요한 계정이 없는 경우"
      vulnerable: "인가되지 않은 계정, 퇴직자 계정, 테스트 계정 등 불필요한 계정이 존재하는 경우"
    action: "계정별 용도를 파악한 후 불필요한 계정 삭제"
    impact: "Demonstration 계정 / Object 사용 불가 / 삭제된 계정 사용 불가"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 불필요한 계정 및 Object 삭제
          SQL> DROP USER [삭제할 계정];
      - os: "MSSQL"
        content: |
          Step 1) 불필요한 계정 삭제
          EXEC sp_droplogin '삭제할 계정';
      - os: "MySQL"
        content: |
          Step 1) 불필요한 계정 삭제
          DROP USER '삭제할 계정'@'호스트명 or IP';
          FLUSH PRIVILEGES;
      - os: "Altibase"
        content: |
          Step 1) 모든 사용자 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 불필요한 계정 삭제
          DROP USER user_name CASCADE;
      - os: "Tibero"
        content: |
          Step 1) 모든 사용자 확인
          Tibero에서는 사용자의 정보를 제공하기 위해 아래 나열된 정적 뷰를 제공하고 있으며, DBA나 일반 사용자 모두 사용할 수 있다.
          SELECT * FROM all_users;
          SELECT * FROM dba_users;
          SELECT * FROM user_users;

          | 정적 뷰 | 설명 |
          |---|---|
          | ALL_USERS | 데이터베이스의 모든 사용자의 기본적인 정보를 조회하는 뷰 |
          | DBA_USERS | 데이터베이스의 모든 사용자의 자세한 정보를 조회하는 뷰 |
          | USER_USERS | 현재 사용자의 정보를 조회하는 뷰 |

          Step 2) 불필요한 계정 삭제
          DROP USER user_name CASCADE;
      - os: "PostgreSQL"
        content: |
          Step 1) 모든 사용자 확인
          쿼리문 조회 : SELECT * FROM system_.sys_users_;
          명령어 조회 : \du
          Step 2) 불필요한 계정 삭제
          DROP ROLE '삭제할 계정';
      - os: "Cubrid"
        content: |
          Step 1) 사용자 계정 목록 확인
          csql> SELECT name, password FROM db_user;
          Step 2) 불필요한 계정 삭제
          csql> DROP USER [삭제할 계정];

  - id: "D-03"
    title: "비밀번호의 사용기간 및 복잡도를 기관의 정책에 맞도록 설정"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용되어 있는지 점검"
      check_purpose: "비밀번호 사용 기간 및 복잡도 설정 유무를 점검하여 비인가자의 비밀번호 추측 공격(무차별 대입 공격, 사전 대입 공격 등)에 대한 대비가 되어있는지 확인하기 위함"
      threat: "비밀번호 사용 기간 및 복잡도 설정이 되어있지 않으면 비인가자가 비밀번호 추측 공격을 통해 획득한 계정의 비밀번호를 이용하여 DB에 접근할 수 있는 위험이 존재함"
      reference:
        - "※ 무차별 대입 공격(Brute Force Attack): 특정 암호를 해독하기 위해 가능한 모든 값을 대입하는 공격 방법"
        - "※ 사전 대입 공격(Dictionary Attack): 사전에 있는 단어를 입력하여 비밀번호를 알아내거나 암호를 해독하는데 사용되는 컴퓨터 공격 방법"
    criteria:
      good: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용된 경우"
      vulnerable: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 설정이 적용되지 않은 경우"
    action: "기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 정책 설정"
    impact: "주기적인 비밀번호 변경 필요"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) PASSWORD_LIFE_TIME Profile 파라미터 변경
          SQL> ALTER PROFILE <프로파일명> LIMIT PASSWORD_LIFE_TIME xx;
          Step 2) Profile 값과 관련된 사용자 변경
          SQL> ALTER PROFILE <계정명> PROFILE <변경할 프로파일명>;
          Step 3) 비밀번호 정책 설정 변경
          SQL> ALTER PROFILE <프로파일명> LIMIT
          FAILED_LOGIN_ATTEMPTS 3 (비밀번호 실패 3번 까지만 가능)
          PASSWORD_LIFE_TIME 30 (30일 동안만 비밀번호 사용 가능
          PASSWORD_REUSE_TIME 30 (사용한 비밀번호 30일 후부터 재사용 가능)
          PASSWORD_VERIFY_FUNCTION verify_function (비밀번호 복잡성 검증)
          PASSWORD_GRACE_TIME 5; (life time이 끝나고 5일 동안 메시지를 보여줌)
      - os: "MSSQL"
        content: |
          Step 1) 비밀번호 변경 주기는 '암호 만료 강제 적용'을 적용함으로써 주기적으로 변경할 수 있으며, 변경 기간은 OS의 '암호 정책'에서 적용받으므로 '암호 정책 > 최대 암호 사용 기간' 설정도 변경해야 함
          Step 2) 암호 만료 강제 적용
          보안 > 로그인 > 각 로그인 계정 > 속성 > "암호 만료 강제 적용" 설정

          [암호 만료 강제 적용 설정]

          Step 3) OS 암호 정책 설정
          [관리 도구] > [로컬 보안 정책] > [보안 설정] > [계정 정책] > [암호 정책] > 최대 암호 사용 기간 : '60일' 설정

          [최대 암호 사용 기간 설정]
      - os: "MySQL"
        content: |
          [비밀번호 복잡도 정책 설정]
          Step 1) 비밀번호 정책 확인
          mysql> SHOW VARIABLES LIKE 'validate_password%';
          ※ component_validate_password가 설치되어 있지 않은 경우 아래와 같이 해당 컴포넌트 설치
          mysql> INSTALL COMPONENT 'file://component_validate_password';
          Step 2) 비밀번호 정책 설정
          다음과 같은 방법으로 각각의 비밀번호 정책을 설정
          SET GLOBAL validate_password.policy = 'MEDIUM';
          (비밀번호 정책의 강도 LOW/MEDIUM/STRONG)
          SET GLOBAL validate_password.length = 8; (비밀번호 최소 길이)
          SET GLOBAL validate_password.mixed_case_count = 1; (포함되어야 하는 영문 대소문자 최소 개수)
          SET GLOBAL validate_password.number_count = 1; (포함되어야 하는 숫자 최소 개수)
          SET GLOBAL validate_password.special_char_count = 1; (포함되어야 하는 특수문자 최소 개수)

          ※ Linux계열(/etc/my.cnf 또는 /etc/mysql/my.cnf), Windows(C:\ProgramData\MySQL\MySQL Server <설치된 버전>\my.ini)의 <mysqld> 섹션에 설정을 추가하여 정책 설정 가능
          ※ 비밀번호 신규 적용 및 초기화 시 설정 규칙에 맞추어 관리하고, 저장 시에는 일방향 암호화 알고리즘을 통해 암호화 처리(One-Way Encryption)함

          [비밀번호 LifeTime 정책 적용]
          Step 1) 비밀번호 정책 확인
          mysql> SHOW VARIABLES LIKE 'default_password_lifetime';
          Step 2) 비밀번호 LifeTime 설정
          mysql> SET GLOBAL default_password_lifetime=90;
          ※ 기본 값
          - 5.7.11 이전 버전 : 0
          - 5.7.11 이후 버전  및 8.0 이후 버전 : 360
          Step 3) 정책 적용전에 생성된 계정의 LifeTime 변경
          mysql> ALTER USER <계정명>'@'<호스트명 or IP>' PASSWORD EXPIRE INTERVAL 91 DAY;
      - os: "Altibase"
        content: |
          Step 1) 다음 명령어를 통해 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 아래 Property에 대해 비밀번호 정책 설정
          CASE_SENSITIVE_PASSWORD = 1
          FAILED_LOGIN_ATTEMPTS
          PASSWORD_LOCK_TIME
          PASSWORD_LIFE_TIME
          PASSWORD_GRACE_TIME
          PASSWORD_REUSE_TIME
          PASSWORD_REUSE_MAX
          PASSWORD_VERIFY_FUNCTION

          정책 적용 시 다음 명령어를 사용
          ALTER USER 계정명 LIMIT (Property 숫자);
          예시) ALTER USER TESTUSER LIMIT (FAILED_LOGIN_ATTEMPTS 7, PASSWORD_LOCK_TIME 7);
      - os: "Tibero"
        content: |
          Step 1) 사용자별 비밀번호 PROFILE 적용 여부 확인
          비밀번호 설정 규칙에 맞추어 비밀번호를 설정할 수 있도록 시스템 차원에서 기능 제공
          SELECT * FROM dba_users;

          [사용자별 비밀번호 PROFILE 적용 여부 확인]

          Step 2) 설정되어 있을 경우 PROFILE 설정 내용 확인
          SELECT * FROM dba_profiles;

          [PROFILE 설정 내용 확인]

          Step 3) 설정되어 있지 않을 경우 PROFILE 생성 또는 수정 시(ALTER PROFILE) 비밀번호 정책 설정 적용 시 다음 명령어를 사용
          CREATE PROFILE prof LIMIT
          예시) CREATE PROFILE prof LIMIT
          failed_login_attempts 3
          password_lock_time 1/1440
          password_life_time 90
          password_reuse_time unlimited
          password_reuse_max 10
          password_grace_time 10
          password_verify_function verify_function;

  - id: "D-06"
    title: "DB 사용자 계정을 개별적으로 부여하여 사용"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "DB 접근 시 사용자별로 서로 다른 계정을 사용하여 접근하는지 점검"
      check_purpose: "사용자별 별도 DBMS 계정을 사용하여 DB에 접근하는지 점검하여 DB 계정 공유 사용으로 발생할 수 있는 로그 감사 추적 문제를 대비하고자 함"
      threat: "DB 계정을 공유하여 사용할 경우 비인가자의 DB 접근 발생 시 계정 공유 사용으로 인해 로그 감사 추적의 어려움이 발생할 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "사용자별 계정을 사용하고 있는 경우"
      vulnerable: "공용 계정을 사용하고 있는 경우"
    action: "사용자별 계정 생성 및 권한 부여"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 계정 확인(SQL*Plus)
          SQL> SELECT username FROM dba_users ORDER BY username;
          Step 2) 공용 계정 삭제
          SQL> DROP USER '공용 계정';
          Step 3) 사용자별, 응용 프로그램별 계정 생성
          SQL> CREATE USER '<계정명>' IDENTIFIED BY '<비밀번호>';
          Step 4) 권한 부여
          SQL> GRANT connect, resource TO [계정명];
      - os: "MSSQL"
        content: |
          Step 1) 공용계정 삭제
          EXEC sp_droplogin '공용 계정';
          Step 2) 사용자별, 응용 프로그램별 계정 생성
          CREATE LOGIN '생성 계정' WITH PASSWORD = '비밀번호';
          CREATE USER '생성 계정' FOR LOGIN '생성 계정' WITH DEFAULT_SCHEMA ='생성 계정';
          ALTER USER '생성 계정';
          EXEC sp_adduser '생성 계정', '생성 계정', 'db_owner';
          EXEC sp_adduser '생성 계정', '생성 계정', '생성 계정';
          EXEC sp_grantdbaccess '생성 계정', '생성 계정';
      - os: "MySQL"
        content: |
          Step 1) 공용용 계정 삭제
          mysql> DROP USER <계정명>@<호스트명 or IP>
          Step 2) 사용자별, 응용 프로그램별 계정 생성 및 권한 설정
          // 사용자 계정 생성
          mysql> create user '<계정명>'@'<호스트명 or IP>' identified by '비밀번호';
          // 특정 데이터베이스의 특정 테이블에 select, insert 권한을 부여
          mysql> grant select, insert on DB이름.테이블명 to '<계정명>'@'<호스트명 or IP>';
          // 특정 데이터베이스의 모든 테이블에 모든 권한을 부여
          mysql> grant all privileges on DB이름.* to '<계정명>'@'<호스트명 or IP>';
          mysql> flush privileges;
          ※ 모든 권한을 부여할 경우, 해당 사용자는 지정된 데이터베이스에서 모든 작업의 수행이 가능하므로 사용자의 관리적 측면에서는 편리하나, 보안적 측면에서는 필요한 최소한의 권한만 부여하여 안정성을 높여야 함
      - os: "Altibase"
        content: |
          Step 1) DB에 생성된 계정 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 공용 계정 확인하여 삭제
          DROP USER <계정명> CASCADE;
          Step 3) 사용자별, 응용 프로그램별 등 목적에 맞게 계정 생성
          CREATE USER <계정명> IDENTIFIED BY <비밀번호>;
      - os: "Tibero"
        content: |
          Step 1) DB에 생성된 계정 확인
          SELECT * FROM dba_users_;
          Step 2) Step1)의 결과에서 공용 계정 확인하여 삭제
          DROP USER [삭제할 계정] CASCADE;
          Step 3) 사용자별, 응용 프로그램별 등 목적에 맞게 계정 생성
          CREATE USER [계정명] IDENTIFIED BY [비밀번호];
      - os: "PostgreSQL"
        content: |
          Step 1) 모든 사용자 확인
          쿼리문 조회 : SELECT * FROM pg_shadow;
          명령어 조회 : \du
          Step 2) 불필요 계정 삭제
          DROP ROLE '삭제할 계정';
          Step 3) 계정 생성 및 권한 추가
          CREATE USER '생성할 계정';
          ALTER ROLE '계정명' '권한명' '권한명' ····;
          \du (계정 생성 및 권한 확인)

          ※ 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
  - id: "D-04"
    title: "데이터베이스 관리자 권한을 꼭 필요한 계정 및 그룹에 대해서만 허용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL, Cubrid 등"
    description:
      check_content: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한을 부여하였는지 점검"
      check_purpose: "관리자 권한이 필요한 계정과 그룹에만 관리자 권한을 부여하였는지 점검하여 관리자 권한의 남용을 방지하여 계정 유출로 인한 비인가자의 DB 접근 가능성을 최소화하고자 함"
      threat: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한을 부여하지 않으면 관리자 권한이 부여된 계정이 비인가자에게 유출될 경우 DB에 접근할 수 있는 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한이 부여된 경우"
      vulnerable: "관리자 권한이 필요 없는 계정 및 그룹에 관리자 권한이 부여된 경우"
    action: "관리자 권한이 필요한 계정 및 그룹에만 관리자 권한 부여"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) SYSDBA 권한 점검
          SQL> SELECT username FROM v$pwfile_users WHERE username NOT IN (SELECT grantee FROM dba_role_privs WHERE granted_role='DBA') AND username != 'INTERNAL' AND SYSDBA = 'TRUE';
          (어떠한 계정이라도 나오는 경우 취약)
          Step 2) Admin에 부적합 계정 존재 여부 점검
          SQL> SELECT grantee, privilege FROM dba_sys_privs WHERE grantee NOT IN ('SYS', 'SYSTEM', 'AQ_ADMINISTRATOR_ROLE', 'DBA', 'DSYS', 'BACSYS', 'HEDULER_ADMIN', 'MSYS') AND admin_option= 'YES' AND grantee NOT IN (SELECT grantee FROM dba_role_privs WHERE granted_role='DBA');
          (어떠한 계정이라도 나오는 경우 취약)
          Step 3) 관리자 권한이 불필요한 계정에서 관련 권한을 제거
          SELECT * FROM DBA_SYS_PRIVS WHERE GRANTEE = '계정명';
          불필요하게 시스템 권한을 부여한 계정의 권한 변경 필요
          REVOKE <권한> FROM <계정명>;
          시스템 권한 부여가 필요한 경우 필요한 테이블별 권한 부여
          GRANT <권한> ON <테이블명> TO <계정명>;
          인가된 사용자는 관리자 권한에 role을 grant한 후, 시스템 권한을 grant하고 role을 인가된 사용자에게 grant 함
          GRANT <Role_name> TO <계정명>;
      - os: "MSSQL"
        content: |
          Step 1) sysadmin서버 역할의 계정 목록을 확인 후 서버 역할에 불필요한 계정이 있는 경우 서버 역할에서 삭제
          EXEC sp_droprolemember 'user_name', 'sysadmin';
          예시) EXEC sp_dropsrvrolemember 'user01', 'sysadmin'; (user01계정을 sysadmin서버 역할에서 삭제)

          [서버 역할에서 불필요 계정 삭제 예시]
      - os: "MySQL"
        content: |
          Step 1) SUPER 권한(관리자 권한)이 부여되어 있는 계정 확인
          SELECT GRANTEE FROM INFORMATION_SCHEMA.USER_PRIVILEGES WHERE PRIVILEGE_TYPE = 'SUPER';
          Step 2) 불필요하게 SUPER 권한이 부여되어 있는 계정에 대해 SUPER 권한 회수
          REVOKE SUPER ON *.* FROM '<계정명>';
          FLUSH PRIVILEGES;
          ※ 만약 관리자 'test'@'localhost' 계정이 바이너리 로그 정리 및 시스템 변수 수정을 위해 SUPER 권한을 필요로 하는 경우 아래와 같은 명령문으로 필요한 권한으로 제한.
          GRANT BINLOG_ADMIN, SYSTEM_VARIABLES_ADMIN ON *.* TO 'test'@'localhost';
          REVOKE SUPER ON *.* FROM 'test'@'localhost';
          FLUSH PRIVILEGES;
      - os: "Altibase"
        content: |
          Step 3) 계정별 부여된 시스템 권한 목록에서 grantee 확인
          SELECT grantee_id FROM system_.sys_grant_system_;
          Step 4) 계정별 부여된 시스템 권한 목록에서 user_id 확인
          SELECT user_id, user_name FROM system_.sys_users_;
          Step 5) 계정별 부여된 시스템 권한 목록에서 priv_id 확인
          SELECT priv_id, priv_name FROM system_.sys_privileges_;
          Step 6) 일반 사용자 계정 생성 시 시스템에 의해 부여되는 기본 권한 외 입력된 경우 해당 권한 삭제

          시스템에 의해 자동으로 부여되는 권한

          | 권한 | privileged_id |
          |---|---|
          | create session | 215 |
          | create table | 217 |
          | create sequence | 210 |
          | create procedure | 205 |
          | create view | 229 |
          | create trigger | 241 |
          | create synonym | 245 |
          | create materialized view | 252 |
          | create library | 256 |
      - os: "Tibero"
        content: |
          Step 1) 계정별 부여된 시스템 권한 목록 확인 후, 아래 명령어 모두 입력
          SELECT * FROM dba_users;
          SELECT * FROM dba_sys_privs;
          Step 2) dba_users 결과값에서 시스템 계정, 일반 계정 확인

          [시스템 계정, 일반 계정 확인]

          Step 3) dba_sys_privs 결과값에서 일반 계정임에도 시스템 권한을 불필요하게 부여받고 있는지 확인

          [일반 계정 권한 불필요하게 부여되어 있는지 확인]

          Step 4) 일반 계정에 불필요한 시스템 권한이 부여된 경우 권한 삭제
      - os: "PostgreSQL"
        content: |
          Step 1) 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
          모든 사용자 확인
          쿼리문 조회 : SELECT * FROM pg_user; or SELECT username, usesuper FROM pg_shadow;
          명령어 조회 : \du
          Step 2) 불필요하게 관리자 권한이 부여된 경우 권한 회수
          ALTER ROLE <계정명> NOSUPERUSER;
          ALTER ROLE <계정명> NOCREATEROLE;
          ALTER ROLE <계정명> NOCREATEDB;
          ALTER ROLE <계정명> NOREPLICATION;
          ALTER ROLE <계정명> NOBYPASSRLS;
      - os: "Cubrid"
        content: |
          Step 1) 계정의 용도 파악 후 불필요한 계정은 삭제, 새로운 계정 생성 시 적절한 권한을 부여하여 생성
          Step 2) DBA 권한을 가진 사용자 계정 확인
          SELECT a.name FROM db_user a, table(direct_groups) AS t(roles) WHERE roles.name = 'DBA';
          DBA 권한을 가진 사용자 중 권한이 불필요한 계정의 권한 회수 or 계정 삭제
          1.  DBA가 가진 권한 한 번에 회수
          REVOKE ALL PRIVILEGES ON test FROM 'GRANT_TEST';
          2. DBA가 가진 권한을 명시적으로 회수
          REVOKE SELECT ON test FROM 'GRANT_TEST';
          REVOKE INSERT ON test FROM 'GRANT_TEST';
          REVOKE UPDATE ON test FROM 'GRANT_TEST';
          REVOKE DELETE ON test FROM 'GRANT_TEST';
          REVOKE ALTER ON test FROM 'GRANT_TEST';
          REVOKE DROP ON test FROM 'GRANT_TEST';
          REVOKE EXECUTE ON test FROM 'GRANT_TEST';
          REVOKE INDEX ON test FROM 'GRANT_TEST';
          REVOKE REFERENCES ON test FROM 'GRANT_TEST';
          3. DBA 권한을 가진 불필요 계정 삭제
          DROP USER 'GRANT_TEST';
          Step 3) 필요할 경우 적절한 권한을 부여하여 새로운 계정 생성
          CREATE USER [계정명] PASSWORD '비밀번호' GROUPS [그룹명];
          예시) CREATE USER test_db PASSWORD 'password' GROUPS DB_USER;

  - id: "D-05"
    title: "비밀번호 재사용에 대한 제약 설정"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, Altibase, Tibero 등"
    description:
      check_content: "비밀번호 변경 시 이전 비밀번호를 재사용할 수 없도록 비밀번호 제약 설정이 되어있는지 점검"
      check_purpose: "비밀번호 재사용 제약 설정 적용 여부를 점검하여 비밀번호 변경 시 이전 비밀번호 재사용을 제약하여 형식적인 비밀번호 변경을 원천적으로 차단하기 위함"
      threat: "비밀번호 재사용 제약 설정이 적용되어 있지 않을 경우 비밀번호 변경 전 사용했던 비밀번호를 재사용함으로써 비인가자의 계정 비밀번호 추측 공격에 대한 시간을 더 많이 허용하여 비밀번호 유출 위험이 증가함"
      reference:
        - "※ 비밀번호 제약 설정: 비밀번호 변경 시 이전에 사용했던 비밀번호를 재사용할 수 없게 하는 설정으로써 이전 암호 재사용 가능 기간(PASSWORD_REUSE_TIME), 이전 암호 재사용 가능 횟수(PASSWORD_REUSE_MAX) 등이 있음"
    criteria:
      good: "비밀번호 재사용 제한 설정을 적용한 경우"
      vulnerable: "비밀번호 재사용 제한 설정을 적용하지 않은 경우"
    action: "PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) SQL*Plus 설정 확인
          -- Check for both reuse max and reuse time not set
          SELECT profile FROM DBA_PROFILES WHERE (resource_name = 'PASSWORD_REUSE_MAX' AND limit IN ('UNLIMITED', 'NULL')) OR (profile IN (SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_TIME') AND limit IN ('UNLIMITED', 'NULL'));

          -- Check for reuse max with value that is less than allowed minimum
          SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_MAX' AND limit NOT IN ('UNLIMITED', 'NULL') AND REGEXP_LIKE(limit, '^[0-9]+$') -- Only consider numeric values AND TO_NUMBER(limit) < 10;

          -- Check for reuse time that is less than allowed minimum
          SELECT profile FROM DBA_PROFILES WHERE resource_name = 'PASSWORD_REUSE_TIME' AND limit NOT IN ('UNLIMITED', 'NULL') AND REGEXP_LIKE(limit, '^[0-9]+$') -- Only consider numeric values AND TO_NUMBER(limit) < 365;
          Step 2) PASSWORD_REUSE_TIME 및 PROFILE 파라미터 수정
          SQL> ALTER PROFILE default LIMIT password_reuse_time 365 password_reuse_max 10;
          SQL> ALTER PROFILE [프로파일명] LIMIT password_reuse_time DEFAULT password_reuse_max default;
      - os: "Altibase"
        content: |
          Step 1) 다음 명령어를 통해 비밀번호 정책 설정 여부 확인
          SELECT * FROM system_.sys_users_;
          Step 2) 아래 Property에 대해 비밀번호 정책 설정
          CASE_SENSITIVE_PASSWORD
          FAILED_LOGIN_ATTEMPTS
          PASSWORD_LOCK_TIME
          PASSWORD_LIFE_TIME
          PASSWORD_GRACE_TIME
          PASSWORD_REUSE_TIME
          PASSWORD_REUSE_MAX
          PASSWORD_VERIFY_FUNCTION

          정책 적용 시 다음 명령어를 사용
          ALTER USER [계정명] LIMIT (Property 숫자);
          예시) ALTER USER TESTUSER LIMIT (FAILED_LOGIN_ATTEMPTS 7, PASSWORD_LOCK_TIME 7);
      - os: "Tibero"
        content: |
          Step 1) 사용자별 비밀번호 PROFILE 적용 여부 확인
          SELECT * FROM dba_users;

          [사용자별 비밀번호 PROFILE 적용 여부 확인]

          Step 2) 설정되어 있을 경우 PROFILE 설정 내용 확인
          SELECT * FROM dba_users;

          [PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터값 확인]

          Step 3) 설정되어 있지 않을 경우 PROFILE 생성 또는 수정 시(ALTER PROFILE) 비밀번호 정책 설정 적용 시 다음 명령어를 사용
          CREATE PROFILE prof LIMIT
          예시) CREATE PROFILE prof LIMIT
          failed_login_attempts 3
          password_lock_time 1/1440
          password_life_time 90
          password_reuse_time unlimited
          password_reuse_max 10
          password_grace_time 10
          password_verify_function verify_function;
  - id: "D-07"
    title: "root 권한으로 서비스 구동 제한"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MySQL, Altibase, Cubrid 등"
    description:
      check_content: "서비스 구동 시 root 계정 또는 root 권한으로 구동되는지 점검"
      check_purpose: "root 권한을 제한적으로 사용함으로써 시스템의 손상, 데이터의 유출 및 변조 등을 차단하여 보안 위협을 방지하기 위함"
      threat: "root 권한으로 서비스를 구동할 경우 시스템 손상, 데이터 유출 및 변조, 감사 및 추적의 어려움 등으로 인해 서비스 공격의 표적이 될 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "DBMS가 root 계정 또는 root 권한이 아닌 별도의 계정 및 권한으로 구동되고 있는 경우"
      vulnerable: "DBMS가 root 계정 또는 root 권한으로 구동되고 있는 경우"
    action: "DBMS 구동 계정 변경"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          $ ps –ef | grep pmon
          Step 2) Oracle Listener 프로세스 사용자 확인
          $ ps –ef | grep tnslsnr
          Step 3) 사용자 계정을 'Oracle'로 전환
          $ su – oracle (현재 사용자/관리자 계정에서 'Oracle' 사용자로 전환)
          $ lsnrctl stop (Oracle Listener 중지)
          $ sqlplus / as sysdba (SQL*Plus 유틸리티를 이용하여 시스템 관리자(SYSDBA) 권한으로 로그인)
          $ shutdown immediate (데이터베이스 종료)
          Step 4) Oracle 서비스 재시작
          $ lsnrctl start (Oracle Listener 시작)
          $ sqlplus / as sysdba (SQL*Plus 유틸리티를 이용하여 시스템 관리자(SYSDBA) 권한으로 로그인)
          $ startup (데이터베이스 시작)
      - os: "MySQL"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | grep mysqld
          Step 2) mysql server configuration 파일에서 [mysqld] 그룹의 'user' 지시자의 설정값 확인
          # cat [mysql server configuration 파일 위치] | grep user (user=mysql로 설정되어 있으면 양호)
          Step 3) mysql server configuration 파일에서 [mysqld] 그룹의 'user' 지시자 설정
          # vi [mysql server configuration 파일 위치] (일반적으로 /etc/my.cnf.d/mysql-server.cnf)
          ※ user = [mysqld를 구동할 시스템의 일반 사용자 계정]
      - os: "Altibase"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | grep altibase | grep –v grep
          Step 2) Altibase 디렉터리 및 파일을 Altibase 전용 계정으로 소유자 변경
          # chown –R [계정명]:[그룹명] '[Altibase 디렉터리 위치]'
          Step 3) Altibase 전용 계정으로 DB 구동
      - os: "Cubrid"
        content: |
          Step 1) 실행 중인 프로세스를 통한 확인
          # ps –ef | egrep 'cub_master|cub_broker|cub_manager' | grep –v grep
          (cub_master, cub_broker, cub_manager 데몬이 root 또는 root 권한으로 구동되었는지 확인)
          Step 2) 삭제 후 cubrid 계정으로 재설치 또는 같은 DB를 생성 후에 언로드/로드를 통해 기존 데이터 이관
  - id: "D-08"
    title: "안전한 암호화 알고리즘 사용"
    severity: "상"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, MSSQL, MySQL, Tibero, PostgreSQL 등"
    description:
      check_content: "해시 알고리즘 SHA-256 이상의 암호화 알고리즘을 사용하는지 점검"
      check_purpose: "안전한 해시 알고리즘 사용으로 데이터의 기밀성 및 무결성을 보장하고, 사용자 인증을 강화하기 위함"
      threat: "SHA-1이나 MD5와 같은 오래된 알고리즘 사용 시 공격자의 무차별 대입 공격 등으로 비밀번호 유추가 가능하며, 데이터 변조 및 유출의 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "해시 알고리즘 SHA-256 이상의 암호화 알고리즘을 사용하고 있는 경우"
      vulnerable: "해시 알고리즘 SHA-256 미만의 암호화 알고리즘을 사용하고 있는 경우"
    action: "SHA-256 이상의 암호화 알고리즘 적용"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "OracleDB"
        content: |
          Step 1) SQL*Plus 쿼리를 통한 암호화 알고리즘 확인
          SELECT username, password_versions FROM dba_users;
          Step 2) sqlnet.ora 파일 수정
          $ vi /u01/app/oracle/product/11.2.0/xe/network/admin/sqlnet.ora
          SQLNET.ALLOWED_LOGON_VERSION_SERVER = 12
          SQLNET.ALLOWED_LOGON_VERSION_CLIENT = 12
          ※ sqlnet.ora 파일 기본 경로
          Unix/Linux : $ORACLE_HOME/network/admin/sqlnet.ora
          Windows : %ORACLE_HOME%\network\admin\sqlnet.ora
          ※ Oracle DB 알고리즘 : 10G(MD5), 11G(SHA-1), 12C(SHA-512, AES)
      - os: "MSSQL"
        content: |
          Step 1) 저장된 비밀번호 해시 값 확인
          select name, password_hash from sys.sql_logins;
          ※ MSSQL 2012이상에서 사용자 계정의 비밀번호는 32bit Salt를 적용한 SHA-512 해시 알고리즘을 사용

          [일반 이용자 패스워드 해시 알고리즘 변경]
          Step 1) 데이터베이스 접속
          USE <데이터베이스명>
          GO
          Step 1) 열 추가
          ALTER TABLE <테이블명> ADD <신규 해시 칼럼명> varbinary(256)
          GO
          Step 2) 새로운 열에 암호화 된 데이터 저장
          UPDATE <테이블명> SET <신규 해시 칼럼명> = HASHBYTES('SHA2_256', <기존 해시 칼럼명>)
          GO
          Step 3) 기존 열 제거
          ALTER TABLE <테이블명> DROP COLUMN <기존 해시 칼럼명>
          GO
      - os: "MySQL"
        content: |
          Step 1) 계정별 암호화 알고리즘 확인
          [mysql 5.7]
          mysql> SELECT user, host, plugin FROM mysql.user; 또는
          mysql> SELECT host, user, plugin, password AS authentication_string FROM mysql.user;
          [mysql 8.0]
          mysql> SELECT user, host, plugin FROM mysql.user; 또는
          mysql> SELECT host, user, plugin, authentication_string FROM mysql.user;
          Step 2) 비밀번호 및 암호화 알고리즘 설정
          [mysql 5.7]
          - user 생성 시 적용
          CREATE USER '계정명'@'host' IDENTIFIED BY '비밀번호';
          - 기존 user 적용
          ALTER USER '계정명'@'host' IDENTIFIED '신규 비밀번호';
          ※ mysql 5.7에서는 기본적으로 mysql_native_password 플러그인이 사용되므로 별도의 지정이 필요하지 않음
          [mysql 8.0]
          - user 생성 시 적용
          mysql> CREATE USER '계정명'@'localhost' IDENTIFIED WITH caching_sha2_password BY '비밀번호';
          - 기존 user 적용
          mysql> ALTER USER '계정명'@'localhost' IDENTIFIED WITH caching_sha2_password BY '비밀번호';
          ※ mysql v8.0 이상부터 암호화 알고리즘으로 caching_sha2_password(SHA-256)가 적용됨
          ※ mysql v5.7 버전에서 사용하던 데이터베이스를 8.0으로 업그레이드하여 mysql_native_password 플러그인이 유지되는 경우 위와 같이 caching_sha2_password 알고리즘을 지정하여 적용할 수 있음
      - os: "Tibero"
        content: |
          Step 1) 쿼리문을 통한 암호화 알고리즘 확인
          SELECT "TS#", "ENCRYPTIONALG", "ENCRYPTEDTS" FROM V$ENCRYPTED_TABLESPACES;
          Step 2) 암호화 알고리즘 적용
          ALTER TABLESPACE "ENCRYPTED_TS" ENCRYPTION USING '적용할 암호화 알고리즘';
      - os: "PostgreSQL"
        content: |
          Step 1) psql 접속 후 계정별 암호화 알고리즘 확인
          postgres=# SELECT usename, passwd FROM pg_shadow;
          Step 2) 명령어를 통한 알고리즘 적용
          - user 생성 시 적용
          postgres=# CREATE USER 계정명 password '설정할 비밀번호';
          - 기존 user 적용
          postgres=# ALTER USER 계정명 WITH password '설정할 비밀번호';
          ※ default 설정으로 SCRAM-SHA-256 암호화 알고리즘이 적용
          ※ peer : 로컬에서만 연결이 가능하며 OS에서 클라이언트의 OS 사용자 이름을 얻고 요청한 데이터베이스 사용자 이름과 일치하는지 확인하는 인증 방식
  - id: "D-09"
    title: "일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정"
    severity: "중"
    domain: "DBMS > 1. 계정 관리"
    target: "Oracle DB, Altibase, Tibero 등"
    description:
      check_content: "DBMS 설정 중 일정 횟수의 로그인 실패 시 계정 잠금 정책에 대한 설정이 되어있는지 점검"
      check_purpose: "일정 횟수의 로그인 실패 시 계정 잠금 정책을 설정하여 비인가자의 자동화된 무차별 대입 공격, 사전 대입 공격 등을 통한 사용자 계정 비밀번호 유출을 방지하기 위함"
      threat: "일정한 횟수의 로그인 실패 횟수를 설정하여 제한하지 않으면 자동화된 방법으로 계정 및 비밀번호를 획득하여 데이터베이스에 접근하여 정보가 유출될 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "로그인 시도 횟수를 제한하는 값을 설정한 경우"
      vulnerable: "로그인 시도 횟수를 제한하는 값을 설정하지 않은 경우"
    action: "로그인 시도 횟수 제한 값 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) Failed_login_attempts Profile 파라미터 수정
          SQL> ALTER PROFILE LIMIT FAILED_LOGIN_ATTEMPTS XX; (XX회 이하로 설정)
          Step 2) Profile 적용
          SQL> connect / as sysdba
          SQL> @$Ora_Home/rdbms/admin/utlpwdmg. 또는
          default profile에 unlimited로 설정하고 이 default 값을 적용하고자 하는 profile에 적용
          SQL> ALTER PROFILE DEFAULT LIMIT PASSWORD_LOCK_TIME UNLIMITED;
          해당 Profile이 잠길 경우 자동으로 해제되지 않음
          SQL> ALTER PROFILE [Profile명] LIMIT PASSWORD_LOCK_TIME XX;
          해당 Profile이 잠길 경우 XX일 이후 잠금 해제
          ※ utlpwdmg.sql : 비밀번호 관리 관련 기능 설정 및 Profile 수정 역할을 하는 스크립트
      - os: "Altibase"
        content: |
          Step 1) SELECT * FROM system_.sys_users_;
          Step 2) 아래 Property에 대해 비밀번호 정책 설정
          CASE_SENSITIVE_PASSWORD
          FAILED_LOGIN_ATTEMPTS
          PASSWORD_LOCK_TIME
          PASSWORD_LIFE_TIME
          PASSWORD_GRACE_TIME
          PASSWORD_REUSE_TIME
          PASSWORD_REUSE_MAX
          PASSWORD_VERIFY_FUNCTION
          Step 3) 정책 적용 시 다음 명령어를 사용
          ALTER USER 계정명 LIMIT (Property 숫자);
          예시) ALTER USER testuser LIMIT (FAILED_LOGIN_ATTEMPTS 7);
      - os: "Tibero"
        content: |
          Step 1) 사용자별 비밀번호 PROFILE 적용 여부 확인
          SELECT * FROM dba_users;

          [사용자별 비밀번호 PROFILE 적용 여부 확인]

          Step 2) 설정되어 있을 경우 PROFILE 설정 내용 확인
          SELECT * FROM dba_profiles;

          [PROFILE 설정 내용 확인]

          Step 3) 설정되어 있지 않을 경우 PROFILE 생성 시(또는 수정 시 ALTER PROFILE) 비밀번호 정책 설정 정책 적용 시 다음 명령어를 사용
          CREATE PROFILE prof LIMIT
          예시) CREATE PROFILE prof LIMIT
          FAILED_LOGIN_ATTEMPTS 3
          PASSWORD_LOCK_TIME 1/1440
          PASSWORD_LIFE_TIME 90
          PASSWORD_REUSE_TIME UNLIMITED
          PASSWORD_REUSE_MAX 10
          PASSWORD_GRACE_TIME 10
          PASSWORD_VERIFY_FUNCTION verify_function;
  - id: "D-10"
    title: "원격에서 DB 서버로의 접속 제한"
    severity: "상"
    domain: "DBMS > 2. 접근 관리"
    target: "Windows OS, Oracle DB, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "지정된 IP주소만 DB 서버에 접근 가능하도록 설정되어 있는지 점검"
      check_purpose: "지정된 IP주소만 DB 서버에 접근 가능하도록 설정되어 있는지 점검하여 비인가자의 DB 서버 접근을 원천적으로 차단하고자 함"
      threat: "DB 서버 접속 시 IP주소 제한이 적용되지 않은 경우 비인가자가 내·외부망 위치에 상관없이 DB 서버에 접근할 수 있는 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "DB 서버에 지정된 IP주소에서만 접근 가능하도록 제한한 경우"
      vulnerable: "DB 서버에 지정된 IP주소에서만 접근 가능하도록 제한하지 않은 경우"
    action: "DB 서버에 대해 지정된 IP주소에서만 접근 가능하도록 설정"
    impact: "허용되지 않은 IP에서 접속 제한"
    examples:
      - os: "Windows OS"
        content: |
          Step 1) 특정 IP주소에서만 접속 가능하도록 방화벽 등이 설정되어 있는지 확인
          시작 > 제어판 > 시스템 및 보안 > Windows Defender 방화벽 > 고급 설정 > 고급 보안이 포함된 Windows Defender 방화벽 > 인바운드 규칙 > 원격 데스크톱 – 사용자 모드(TCP-In)/사용자 모드(UDP-In)

          [원격 데스크톱 방화벽 규칙 확인]

          Step 2) DB서버에 접근 가능한 특정 IP 지정
          원격 데스크톱 – 사용자 모드(TCP-In)/사용자 모드(UDP-In) 속성 > 영역 > 원격 IP주소 > 다음 IP주소 > 추가 > IP주소 입력

          [원격 데스크톱 – 사용자 모드(TCP-In) 속성]

          [원격 데스크톱 – 사용자 모드(UDP-In) 속성]
      - os: "Oracle DB"
        content: |
          Step 1) oracle 계정으로 로그인
          su - oracle
          Step 1) 텍스트 에디터로 $ORA_NET/sqlnet.ora 파일 오픈
          vi $ORA_NET/sqlnet.ora
          Step 2) sqlnet.ora 파일의 끝에 다음 두 라인을 추가
          tcp.validnode_checking = yes
          tcp.invited_nodes = ( 127.0.0.1, [allowed IP's] )
          Step 3) Listener 재시작
          $ORACLE_HOME/bin/lsnrctl stop
          $ORACLE_HOME/bin/lsnrctl start
      - os: "MySQL"
        content: |
          Step 1) user 테이블을 조회하여 모든 클리이언트에서 접속 가능하도록 설정되어 있는 계정을 특정 IP에서만 접속 가능하도록 변경
          mysql> UPDATE user SET host = '<접속 IP>' WHERE user ='<계정명>' and host='%';
      - os: "Altibase"
        content: |
          Step 1) Altibase HDB Property 파일을 수정하여 접근 제어 적용
          $Altibase_HOME/conf/altibase.properties의 IP Access Control Lists에서 내부 정책에 맞게 수정
          ※ Altibase HDB 서버가 실행되지 않은 상태에서 할 수 있는 정적인 환경설정 방법으로 Property 파일에서 해당 구성 요소를 특정 값으로 설정한 후 Altibase HDB 서버를 구동해야 수정된 값이 Altibase HDB 서버에 반영됨

          [altibase.properties 파일]

          Step 2) Altibase HDB 서버에 적용된 접근 제어 설정 확인
          iSQL> SELECT name, value1 FROM v$property WHERE name LIKE 'ACCESS_CONTROL_%';
      - os: "Tibero"
        content: |
          Step 1) LSNR_INVITED_IP(특정 IP주소를 갖는 클라이언트만 허용, 그 외 차단)
          $TB_SID.tip 파일 안에 다음 예시 내용을 참조하여 입력
          LSNR_INVITED_IP=192.168.1.1;192.168.2.0/24;192.1.0.0/16
          LSNR_INVITED_IP의 최대 길이는 255자이며, 256자 이상의 IP주소를 설정할 경우에는 LSNR_INVITED_IP_FILE을 사용
          (특정 IP주소를 기재한 파일의 절대 경로를 LSNR_INVITED_IP_FILE에 입력)
          ※ 초기화 파라미터에 설정된 IP주소에 따라 클라이언트의 네트워크 접속을 허용하거나 차단
          ※ $TB_SID는 Tibero 설치 시 입력한 데이터베이스 이름과 동일(/ c:/tibero/tibero5/config/데이터베이스.tip)
          ● $TB_SID.tip 파일에 LSNR_INVITED_IP와 LSNR_DENIED_IP가 모두 설정되어 있는 경우 LSNR_DENIED_IP의 설정은 무시되며 LSNR_INVITED_IP만 적용된다. 즉, LSNR_INVITED_IP에 설정된 IP주소의 클라이언트를 제외하고는 모든 접속이 차단된다.
          ● $TB_SID.tip 파일에 LSNR_INVITED_IP와 LSNR_DENIED_IP가 모두 설정되지 않은 경우 모든 클라이언트의 네트워크 접속이 허용된다.
          ● 루프백 주소(Loopback Address, 127.0.0.1)에서 접속하는 경우 LSNR_INVITED_IP 또는 LSNR_DENIED_IP의 설정과는 무관하게 항상 허용된다. X Tibero 서버를 운영하는 중에 서버를 다시 기동하지 않고 LSNR_INVITED_IP 또는 LSNR_DENIED_IP의 설정을 변경하려는 경우 우선 $TB_SID.tip 파일에 LSNR_INVITED_IP 또는 LSNR_DENIED_IP의설정을 변경한 후 파일을 저장하고 다음의 명령을 실행한다.
          ALTER SYSTEM LISTENER PARAMETER RELOAD;
          위의 명령을 실행하면 $TB_SID.tip 파일에서 LSNR_INVITED_IP 또는 LSNR_DENIED_IP의 내용을 다시 읽어 변경된 내용을 실시간으로 적용한다.
      - os: "PostgreSQL"
        content: |
          Step 1) Data 디렉터리 내에 postgres.conf 파일 설정

          [postgres.conf 파일]

          ※ listen_addresses는 서버가 클라이언트 애플리케이션의 연결을 수신 대기할 TCP/IP 주소를 지정함. 호스트 이름 및/또는 숫자 IP 주소의 쉼표로 구분된 목록 형식으로 지정할 수 있으며, *를 사용하는 경우 모든 IP에 대해 수신 대기함. 기본값은 localhost 이며 로컬 TCP/IP "루프백" 연결 만 허용
          Step 2) Data 디렉터리 내에 pg_hba.conf 파일 설정

          | TYPE | DATABASE | USER | CIDR-ADDRESS | METHOD |
          |---|---|---|---|---|
          | host | (DB명) | (사용자) | (접속 허용 IP) | md5 |

          [pg_hba.conf 파일]

          Step 3) USER에 접근 허용 '계정명'과 CIDR-ADDRESS에 접속을 '허용할 IP' 설정
          ※ PostgreSQL은 기본 설치 시 외부에서 접속할 수 없음
          ※ IP 접근 제한 설정 시 postgresql.conf와 pg_hba.conf 두 개의 설정 파일이 연계되어 있으므로 하나의 파일이라도 설정이 잘못되어 있는 경우 DB 접속이 불가능 할 수 있음.
  - id: "D-11"
    title: "DBA 이외의 인가되지 않은 사용자가 시스템 테이블에 접근할 수 없도록 설정"
    severity: "상"
    domain: "DBMS > 2. 접근 관리"
    target: "Oracle DB, MSSQL, MySQL, Altibase, Tibero, PostgreSQL 등"
    description:
      check_content: "시스템 테이블에 일반 사용자 계정이 접근할 수 없도록 설정되어 있는지 점검"
      check_purpose: "시스템 테이블의 일반 사용자 계정 접근 제한 설정 적용 여부를 점검하여 일반 사용자 계정 유출 시 발생할 수 있는 비인가자의 시스템 테이블 접근 위험을 차단하기 위함"
      threat: "시스템 테이블의 일반 사용자 계정 접근 제한 설정이 되어있지 않을 경우 Object, 사용자, 테이블 및 뷰, 작업 내역 등의 시스템 테이블에 저장된 정보가 누출될 수 있음"
      reference:
        - "-"
    criteria:
      good: "시스템 테이블에 DBA만 접근 가능하도록 설정되어 있는 경우"
      vulnerable: "시스템 테이블에 DBA 외 일반 사용자 계정이 접근 가능하도록 설정되어 있는 경우"
    action: "시스템 테이블에 일반 사용자 계정이 접근할 수 없도록 설정"
    impact: "일반 계정으로 시스템 테이블 접근 불가"
    examples:
      - os: "Oracle DB, Tibero"
        content: |
          Step 1) DBA만 접근 가능한 테이블의 권한 확인(SQL*Plus)
          SQL> SELECT grantee, privilege, owner, table_name FROM dba_tab_privs WHERE (owner = 'SYS' or table_name LIKE 'DBA_%') AND privilege <> 'EXECUTE' AND grantee NOT IN ('PUBLIC', 'AQ_ADMINISTRATOR_ROLE', 'AQ_USER_ROLE', 'AURORA$JIS$UTILITY$', 'OSE$HTTP$ADMIN', 'TRACESVR', 'CTXSYS', 'DBA', 'DELETE_CATALOG_ROLE', 'EXECUTE_CATALOG_ROLE', 'EXP_FULL_DATABASE', 'GATHER_SYSTEM_STATISTICS', 'HS_ADMIN_ROLE', 'IMP_FULL_DATABASE', 'LOGSTDBY_ADMINISTRATOR', 'MDSYS', 'ODM', 'OEM_MONITOR', 'OLAPSYS', 'ORDSYS', 'OUTLN', 'RECOVERY_CATALOG_OWNER', 'SELECT_CATALOG_ROLE', 'SNMPAGENT', 'SYSTEM', 'WKSYS', 'WKUSER', 'WMSYS', 'WM_ADMIN_ROLE', 'XDB', 'LBACSYS', 'PERFSTAT', 'XDBADMIN') AND grantee NOT IN (SELECT grantee FROM dba_role_privs WHERE granted_role = 'DBA') ORDER BY grantee; (어떤 계정이나 role이 나타나지 않으면 양호)
          Step 2) 불필요하게 테이블 접근 권한이 사용자 계정에 할당된 경우(SQL*Plus)
          SQL> REVOKE <권한> ON <Object> FROM user;
      - os: "MSSQL"
        content: |
          Step 1) system tables 접근 권한이 PUBLIC, GUEST 또는 비인가된 사용자에게 부여된 경우 접근 권한을 제거
          REVOKE <권한> ON <Object> FROM [계정명]|[PUBLIC]|[GUEST];
          Step 2) 시스템 테이블에 접근하기 위해서는 stored procedure 또는 information_schema views를 통해 접근해야 함
          Step 3) 시스템 테이블에 접근 가능한 stored procedure는 사용이 제한되어야 함
      - os: "MySQL"
        content: |
          Step 1) 사용자 계정에 부여된 권한 확인
          SHOW GRANTS FOR <계정명>;
          Step 2) 접근이 필요한 데이터베이스 및 테이블에만 권한 적용
          GRANT <권한> privileges ON <DB명>.<테이블명> to '<계정명>'@'<호스트명 or IP>';
      - os: "Altibase"
        content: |
          Step 1) sys_tables_를 조회하여 system_ 외 접근 계정 유무 확인
          SELECT * FROM system_.sys_tables_;
          Step 2) 불필요 계정 접근 시 해당 접근 해제
      - os: "PostgreSQL"
        content: |
          Step 1) 사용자 및 역할 권한 정보 조회
          SELECT * FROM information_schema.role_table_grants;
          Step 2) 스키마명에 해당되는 Table에 대한 접근 권한을 일반 사용자로부터 제거
          REVOKE [all,select,insert,update...] ON all tables IN schema '스키마명' FROM '계정명';
  - id: "D-12"
    title: "안전한 리스너 비밀번호 설정 및 사용"
    severity: "상"
    domain: "DBMS > 2. 접근 관리"
    target: "Oracle DB"
    description:
      check_content: "오라클 데이터베이스 Listener의 비밀번호 설정 여부 점검"
      check_purpose: "Listener의 Owner는 DBA가 아니더라도 Listener를 shutdown 시키거나 DB 서버에 임의의 파일을 생성할 수 있으며, 원격에서 LSNRCTL 유틸리티를 사용하여 listener.ora 파일에 대한 변경이 가능하므로 Listener에 비밀번호를 설정하여 비인가자가 이를 수정하지 못하도록 하기 위함"
      threat: "Listener에 비밀번호가 설정되지 않았을 경우 DoS, 정보 획득, Listener 프로세스를 중지시킬 수 있는 위험이 존재함"
      reference:
        - "※ 오라클 Listener: 클라이언트가 원격에서 오라클 DB에 접근할 때 접근 요청을 처리하기 위한 서버 쪽 프로세스, 혹은 네트워크 인터페이스를 말하며 TCP/1521 포트를 사용함"
        - "※ listener.ora: 오라클 서버에서 클라이언트의 요청을 듣고, 클라이언트와의 통신 환경을 설정하는 파일"
    criteria:
      good: "Listener의 비밀번호가 설정된 경우"
      vulnerable: "Listener의 비밀번호가 설정되어 있지 않은 경우"
    action: "Listener 비밀번호 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          Step 1) Listener 비밀번호 설정
          LSNRCTL> change_password
          Old password: <Old Password> (Not displayed)
          New password: <New password> (Not displayed)
          Reenter new password: <New password> (Not displayed)Connecting (DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=prolin1)(PORT=1521)(IP=FIRST)))
          Password change for LISTENER
          The command completed successfully
          LSNRCTL> set password
          LSNRCTL> save_config
          Step 2) Listener 매개변수 설정
          1. $TNS_ADMIN/listener.ora 파일 내에 아래 Option 추가
          PASSWORDS_<listener_name> = <Encrypted Password>
          ADMIN_RESTRICTIONS_<listener_name> = ON
          2. Listener 재시작 및 상태 확인
          LSNRCTL> lsnrctl stop
          LSNRCTL> lsnrctl start
          LSNRCTL> lsnrctl reload
          LSNRCTL> lsnrctl status
          ※ Oracle 12c release 2 이후 버전은 Listener 비밀번호 설정을 지원하지 않으므로 해당사항 없음
  - id: "D-13"
    title: "불필요한 ODBC/OLE-DB 데이터 소스와 드라이브를 제거하여 사용"
    severity: "중"
    domain: "DBMS > 2. 접근 관리"
    target: "Windows OS"
    description:
      check_content: "사용하지 않는 불필요한 ODBC/OLE-DB가 설치되어 있는지 점검"
      check_purpose: "불필요한 데이터 소스 및 드라이버를 제거함으로써 비인가자에 의한 데이터베이스 접속 및 자료 유출을 차단하기 위함"
      threat: "불필요한 ODBC/OLE-DB 데이터 소스를 통한 비인가자의 데이터베이스 접속 및 주요 정보유출에 대한 위험이 발생할 수 있음"
      reference:
        - "※ 특정 샘플 응용 프로그램은 샘플 데이터베이스를 위해 ODBC 데이터 소스를 설치하거나 불필요한 ODBC/OLE-DB 데이터베이스 드라이브를 설치하므로 불필요한 데이터 소스나 드라이버는 ODBC 데이터 소스 관리자 도구를 이용해서 제거하는 것이 바람직함"
    criteria:
      good: "불필요한 ODBC/OLE-DB가 설치되지 않은 경우"
      vulnerable: "불필요한 ODBC/OLE-DB가 설치된 경우"
    action: "불필요한 ODBC/OLE-DB 제거"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows NT"
        content: |
          Step 1) 사용하지 않는 불필요한 ODBC 데이터 소스 확인
          시작> 설정 > 제어판 > 관리 도구 > 데이터 원본(ODBC) > 시스템 DSN
          Step 2) 사용하지 않는 데이터 소스 제거
      - os: "Windows 2000, 2003, 2008, 2012, 2016"
        content: |
          Step 1) 사용하지 않는 불필요한 ODBC 데이터 소스 확인
          시작 > 설정 > 제어판 > 관리 도구 > 데이터 원본 (ODBC) > 시스템 DSN > 해당 드라이브 클릭
          Step 2) 사용하지 않는 데이터 소스 제거

          [사용하지 않는 데이터 소스 제거]
      - os: "Windows 2019, 2022"
        content: |
          Step 1) ODBC 사용하지 않는 불필요한 데이터 소스 확인
          시작 > 설정 > 제어판 > 시스템 및 보안 > 관리 도구 > ODBC 데이터 원본 관리자(32비트/64비트) > 시스템DSN > 해당 드라이브 클릭
          Step 2) 사용하지 않는 데이터 소스 제거

          [사용하지 않는 데이터 소스 제거]
  - id: "D-14"
    title: "데이터베이스의 주요 설정 파일, 비밀번호 파일 등과 같은 주요 파일들의 접근 권한이 적절하게 설정"
    severity: "중"
    domain: "DBMS > 2. 접근 관리"
    target: "Oracle DB, PostgreSQL, Cubrid 등"
    description:
      check_content: "데이터베이스의 주요 파일들에 대해 관리자를 제외한 일반 사용자의 파일 수정 권한을 제거하였는지 점검"
      check_purpose: "데이터베이스의 주요 파일에 관리자를 제외한 일반 사용자의 파일 수정 권한을 제거함으로써 비인가자에 의한 DBMS 주요 파일 변경이나 삭제를 방지하고 주요 정보 유출을 방지할 수 있음"
      threat: "데이터베이스 주요 파일에 비인가자가 접근하여 수정 및 삭제 시 데이터베이스 운영에 장애가 발생할 수 있으며 계정 비밀번호 정보 등 중요 정보의 유출 위험이 존재함"
      reference:
        - "※ 데이터베이스의 주요 파일: orapw.ora, listener.ora,init<SID>.ora, redo 파일, 데이터베이스 설정 파일, 네트워크 설정 파일 등"
    criteria:
      good: "주요 설정 파일 및 디렉터리의 권한 설정 시 일반 사용자의 수정 권한을 제거한 경우"
      vulnerable: "주요 설정 파일 및 디렉터리의 권한 설정 시 일반 사용자의 수정 권한을 제거하지 않은 경우"
    action: "주요 설정 파일 및 디렉터리의 권한 설정 변경"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Oracle DB"
        content: |
          [Unix OS]
          Step 1) 디렉터리 또는 파일의 권한 점검
          $ORACLE_HOME/bin/oracle (755)
          $ORACLE_HOME/bin/[    ] (755)
          → [.sqlplus,sqlldr,sqlload,proc,oraenv,oerr,exp,imp,tkprof,tnsping,wrap]
          $ORACLE_HOME/bin/[    ] (750)
          → [.svrmgrl, lsnrctl, dbsnmp]
          $ORACLE_HOME/network (755)
          $ORACLE_HOME/network/admin/[    ] (755)
          → [.listener.ora, sqlnet.ora 등]
          $ORACLE_HOME/lib (755)
          $ORACLE_HOME/network/admin/[    ] (644)
          → [.tnsnames.ora, protocol.ora, sqlpnet.ora]
          $ORACLE_HOME/dbs/init.ora (640)
          $ORACLE_HOME/dbs/init<SID>.ora (640)
          - Find $ORACLE_HOME –name init*.ora –print
          - 파일 및 디렉터리의 권한 설정 변경
          # chmod <적용 권한> <파일명>
          Step 2) redo 파일, 데이터베이스 설정 파일, 데이터 파일 위치 확인(SQL*Plus)
          SQL> Select value from v$parameter where name='spfile';
          SQL> Select 'Control Files: '||value from v$parameter where name='control_files';
          SQL> select 'Control Files: '||value from v$parameter where name='spfile';
          SQL> select 'Logfile: '||member from v$logfile;
          SQL> select 'Datafile: '||name from v$datafile;
          - 파일 및 디렉터리의 권한 설정 변경
          # chmod <적용 권한> <파일명>
          [Windows OS]
          Step 1) 패스워드 파일(orapw<SID>) 접근 권한은 administrators, system group, owner group, oracle service count, DBA에게 모든 권한 또는, 그 이하로 설정하고 다른 그룹은 제거함
      - os: "MySQL"
        content: |
          [Unix OS]
          Step 1) 설정 파일 (my.cnf, my.ini)의 접근 권한 설정
          설정 파일 (my.cnf, my.ini)의 접근 권한을 설정 파일에 대한 보호를 위하여 600 또는 640으로 설정
          my.cnf 파일 위치: /etc/my.cnf, <각 홈디렉터리>/my.cnf
          # chmod 600 ./my.cnf
          [Windows OS]
          Step 1) 설정 파일의 접근 권한은 Adminisrators, SYSTEM, Owner에게 모든 권한 또는 그 이하로 설정하고 다른 그룹은 제거함
      - os: "PostgreSQL"
        content: |
          [Unix OS]
          Step 1) 주요 설정 파일 위치 확인
          postgresql.conf 파일 위치: [$datadir]
          DB 접속 통제 설정 파일 위치: /postgres/data/pg_hba.conf, /postgres/data/pg_ident.conf
          log_directory : /log_directory/pg_log
          Step 2) 주요 설정 파일의 권한 설정
          환경설정 파일(postgresql.conf)의 권한을 640 이하로 설정
          # chmod 640 [$datadir]/postgresql.conf
          DB접속 통제 설정 파일(pg_hba.conf, pg_ident.conf)의 권한을 640 이하로 설정
          # chmod 640 ./pg_hba.conf
          # chmod 640 ./pg_ident.conf
          히스토리 파일 (.psql_history)의 권한을 600 이하로 설정
          $chmod 600 .psql_history
          Log 파일(pg_log)의 권한을 640 이하로 설정
          #chmod 640 [Log 파일]
          [Windows OS]
          Step 1) 주요 환경설정 파일의 접근 권한은 Administrators, SYSTEM, Owner에게 모든 권한 또는 필요 권한만 부여하여 설정하고 기타 다른 그룹은 권한 제거
      - os: "Cubrid"
        content: |
          Step 1) cubrid.conf 파일 권한 확인
          # ls –l $_CUBRID_DATABASES/conf/cubrid.conf 또는
          # ls –l /root/CUBRID-11.2.8.0824-bf70ab7-Linux.x86_64/conf/cubrid.conf (설치경로 직접 입력)
          Step 2) cubrid.conf 파일 권한 설정
          # sudo chmod 640 /root/CUBRID-11.2.8.0824-bf70ab7-Linux.x86_64/conf/cubrid.conf
          ※ cubrid.conf 파일의 권한이 600 또는 640일 경우 양호함
