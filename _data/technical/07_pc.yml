platform: "7. PC"
platform_number: 7
items:
  - id: "PC-01"
    title: "비밀번호의 주기적 변경"
    severity: "상"
    domain: "PC > 1. 계정 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "최대 암호 사용 기간이 \"90일\" 이하 설정 여부 점검"
      check_purpose: "비밀번호를 주기적으로 변경하여 비밀번호 크래킹의 가능성을 낮추고, 불법으로 획득한 비밀번호의 무단 사용을 방지하기 위함"
      threat: "동일한 비밀번호를 변경하지 않고 오랫동안 사용할 경우 유출이나 무차별 대입 공격에 당할 가능성이 크고 이전에 사용하던 비밀번호를 재사용한다면 비밀번호 추측 공격으로 계정을 탈취당할 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "최대 암호 사용 기간이 \"90일\" 이하로 설정된 경우"
      vulnerable: "최대 암호 사용 기간이 \"제한 없음\"이거나 \"90일을\"을 초과하여 설정된 경우"
    action: |
      ※ 최대 암호 사용 기간 "90일" 설정
      ※ 최소 암호 사용 기간 "1일" 설정
      ※ 최근 암호 기억 설정 (권장: 24개의 비밀번호 기억)
      ※ 사용자가 새 비밀번호를 변경하기 전에 이를 유지해야 하는 일수를 결정. 비밀번호 변경 후 편의성 때문에 기존 비밀번호로 다시 설정하는 경우가 많으므로 최소 사용 기간을 설정
      ※ 이전 비밀번호를 다시 사용한다면 변경 주기가 의미가 없으므로 기존에 사용하던 비밀번호를 기억해서 사용하지 못하게 함
    impact: "비밀번호 변경 시 기존 사용했던 비밀번호를 재사용할 수 없음"
    examples:
      - os: "Windows 10, 11"
        content: |
          [계정별 비밀번호 기간 설정]
          Step 1) 시작 > 실행 > LUSRMGR.MSC
          Step 2) 사용자 > 계정별 속성 > "암호 사용 기간 제한 없음(P)", "계정 사용 안함(B)" 적용 해제

          [계정별 비밀번호 정책 적용]

          [비밀번호 정책 설정]
          Step 1) 시작 > Windows 관리 도구 > 로컬 보안 정책
          Step 2) 보안 설정 > 계정 정책 > 암호 정책 > "최대 암호 사용 기간" 속성을 "90일", "최근 암호 기억"을 "24개", "최소 암호 사용 기간"을 "1일"로 설정

          [비밀번호 정책 적용 확인]

  - id: "PC-02"
    title: "비밀번호 관리정책 설정"
    severity: "상"
    domain: "PC > 1. 계정 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "비밀번호 설정 정책이 복잡성을 만족하는지 점검"
      check_purpose: "안전한 비밀번호 (*비밀번호 설정 기준 참고)를 사용함으로써 무차별 대입 공격, 사전공격 등 비밀번호 탈취 목적의 공격에 대해 대비하기 위함"
      threat: "주기적으로 보안 패치를 적용하지 않을 경우, 버전 취약점을 이용한 공격 또는 새로운 공격에 대한 침해 사고가 발생할 수 있는 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "복잡성을 만족하는 비밀번호 정책이 설정된 경우"
      vulnerable: "비밀번호를 사용하지 않거나, 추측하기 쉬운 문자조합으로 이루어진 짧은 자릿수의 비밀번호를 설정된 경우"
    action: "비밀번호 정책을 해당 기관의 보안 정책에 적합하게 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 시작 > Windows 관리 도구(Windows Tools ) > 로컬 보안 정책
          Step 2) 보안 설정 > 계정 정책 > 암호 정책 > "최소 암호 길이" 속성을 "8문자(이상)", "암호는 복잡성을 만족해야함"을 "사용함"으로 설정

          [암호 정책 적용 확인]

          [비밀번호 설정 기준]
          1. 영문, 숫자, 특수문자를 조합하여 계정명과 상이한 8자 이상의 비밀번호 설정
          ※ 다음 각 항목의 문자 종류 중 2종류 이상을 조합하여 최소 10자리 이상 또는 3종류 이상을 조합하여 최소 8자리 이상의 길이로 구성
          (1) 영문 대문자(26개)
          (1) 영문 소문자(26개)
          (2) 숫자(10개)
          (3) 특수문자(32개)

          1. 비밀번호는 비인가자에 의한 추측이 어렵게 다음의 사항을 반영하여 설계
          (1) Null(공백) 비밀번호 사용 금지
          (1) 문자 또는 숫자만으로 구성 금지
          (2) 사용자 ID와 같거나 유사하지 않은 비밀번호 금지
          (3) 연속적인 문자나 숫자 사용 (예) 1111, 1234, abcd) 사용 금지
          (4) 주기성 비밀번호 재사용 금지
          (5) 전화번호, 생일과 같이 추측하기 쉬운 개인정보를 비밀번호로 사용 금지

          2. 아래와 같은 비밀번호 설정 지양
          Null, 계정과 같거나 유사한 스트링, 지역명, 부서명, 담당자명, 대표 업무명 "root", "rootroot", "root123", "123root", "admin", "admin123", "123admin", "osadmin", "adminos"

  - id: "PC-03"
    title: "복구 콘솔에서 자동 로그온을 금지하도록 설정"
    severity: "중"
    domain: "PC > 1. 계정관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "Windows 복구 콘솔 자동 로그인 설정이 허용 여부 점검"
      check_purpose: "복구 콘솔 자동 로그온 허용을 \"사용 안 함\"으로 설정함으로써 비인가자의 복구 콘솔을 통한 관리자 권한 탈취 등의 위험을 방지하기 위함"
      threat: "Windows 복구 콘솔(Recovery Console) 자동 로그온 설정은 시스템 액세스 허가 전 Administrator 계정의 비밀번호 제공 여부를 결정하는 것으로 이 옵션을 사용하면 비인가자도 복구 콘솔을 이용해 관리자 권한으로 시스템에 자동으로 로그온할 수 있는 위험이 존재함"
      reference:
        - "※ 복구 콘솔(Recovery Console): Windows 2000, Windows XP, Windows 서버 2003 운영 체제의 기능 가운데 하나로 Windows가 그래픽 사용자 인터페이스(GUI)가 나타날 때까지 시동이 되지 않는 상황에서 관리자들이 복구할 수 있게 하는 것이 주된 기능임. 이 콘솔을 통해 관리자들이 명령줄 인터페이스를 이용하여 제한된 영역의 작업을 수행할 수 있음"
    criteria:
      good: "복구 콘솔 자동 로그온 허용이 \"사용 안 함\"으로 설정된 경우"
      vulnerable: "복구 콘솔 자동 로그온 허용이 \"사용\"으로 설정된 경우"
    action: "복구 콘솔 자동 로그온 허용 \"사용 안 함\"으로 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 시작 > 모든 앱 > Windows Tools > 로컬 보안 정책 > 보안 설정 > 로컬 정책 > 보안 옵션
          Step 2) "복구 콘솔: 자동 관리 로그온 허용" 속성 "사용 안 함" 설정

          ["복구 콘솔: 자동 관리 로그온 허용" "사용 안함" 설정]

  - id: "PC-04"
    title: "공유 폴더 제거"
    severity: "상"
    domain: "PC > 2. 서비스 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "기본 공유 폴더(C$, D$, Admin$), 미사용 공유 폴더가 존재하는지 점검하고 공유 폴더를 사용하는 경우 공유 폴더 접근 권한에 \"Everyone\"이 존재하거나 접근을 위한 비밀번호 설정 여부 점검"
      check_purpose: "사용하지 않는 불필요한 공유 폴더를 해제하거나 불가피하게 사용하고 있는 공유 폴더의 경우 비밀번호를 설정하는 등의 조치를 통해 인가된 사용자만 접근할 수 있게 함으로써 무분별한 접근을 제한하기 위함"
      threat: |
        ▪ 시스템 기본 공유 폴더의 경우 기본 드라이브를 개방해놓고 사용하는 것과 같은 위험이 존재함 (예시 : 실행 창 -> \\192.168.16.xxx\C$로 C 드라이브 접근 가능)
        ▪ 접근 권한이 Everyone으로 설정된 공유 폴더는 정보 유출 및 악성코드 유포의 접점이 될 수 있는 위험이 존재함
      reference:
        - "-"
    criteria:
      good: "불필요한 공유 폴더가 존재하지 않거나 공유 폴더에 접근 권한 및 비밀번호가 설정된 경우"
      vulnerable: "불필요한 공유 폴더가 존재하거나 접근 권한 및 비밀번호 설정 없이 공유 폴더가 사용된 경우"
    action: |
      ▪ 공유 폴더 불필요 시 삭제
      ▪ 공유 폴더 필요하면 적절한 접근 권한 부여 및 비밀번호 설정
      ▪ 조치 후 "AutoShareWks"값 변경으로 자동 공유 방지
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          [기본 공유 폴더 설정]
          Step 1) 기본 공유 폴더 상태 확인 및 공유 중지
          시작 > 모든 앱> Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          (시작 > 실행 > "fsmgmt.msc" 입력 > 공유)
          Step 2) 불필요한 공유 폴더 확인 > 해당 공유 폴더 우클릭 > 공유 중지(S)

          [공유 폴더 "공유 중지" 설정]

          Step 3) 시작 > 모든 앱 > Windows Tools > 레지스트리 편집기
          Step 4) 레지스트리 경로로 이동
          HKLM\SYSTEM\CurrentControlSet\Service\LanmanServer\Parameters
          Step 1) 설정값 입력

          | Value name | SecurityLevel |
          | Data Type | Dword 값 |
          | Value | 0(zero) |

          ["AutoShareWks" 레지스트리 값 0으로 설정]

          Step 5) 값이 없는 경우, 새로 만들기 > "AutoShareWks"를 추가하고 값을 "0"으로 입력
          아래 그림과 같이 "AutoShareWks"를 입력하며, 이때 값은 기본값인 "0"으로 유지
          또한, 방화벽과 라우터에서 135,139(TCP/UDP) Port를 차단하여 보안성을 높일 수 있음

          ※ 기본 공유에 대한 조치 시 반드시 [기본 공유 삭제], [비활성화 레지스트리 값]을 모두 설정함

          [일반 공유 폴더 설정]
          Step 1) 일반 공유 폴더 확인 및 공유 중지
          시작 > 모든 앱 > Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          (시작 > 실행 > "fsmgmt.msc" 입력 > 공유)
          Step 2) 불필요한 공유 폴더 확인 > 해당 공유 폴더 우클릭 > 공유 중지

          [공유 중지]

          Step 3) 일반 공유 폴더 필요한 시 권한 설정
          시작 > 모든 앱 Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          Step 4) 사용할 공유 폴더 확인 선택 후 우클릭 > 속성 > [공유] 탭 > [공유 사용 권한] 탭 "Everyone"으로 된 공유를 제거하고, 접근이 필요한 계정에만 적절한 권한 추가

          [공유 사용 권한 "Everyone" 제거]

          [공유 폴더 접근 비밀번호 설정]
          Step 1) 시작 > 설정 > 네트워크 및 인터넷 > 고급 네트워크 설정 > 고급 공유 설정 > 모든 네트워크
          Step 2) "암호로 보호된 공유" 켬 설정
          Step 3) 공유 폴더 접근 가능 여부 확인
          시작 > 모든 앱 > Windows Tools > 실행 > 공유 폴더 PC 계정명 또는, IP주소 입력 후 비밀번호 입력 팝업 확인

          [공유 폴더 접근 가능 여부 확인]

          [공유 폴더 설정 기준]
          1. C$, D$, Admin$ 등의 기본 공유 폴더 제거
          2. 기본 공유 폴더 제거 후 시스템 재부팅 시 "기본 공유 폴더가 자동으로 공유되는 것"을 방지하기 위해 해당 레지스트리의 "AutoShareWks" 값을 "0"으로 설정
          3. 일반 공유 폴더 사용 시 공유 폴더 접근 권한에 "Everyone" 제거
          4. 일반 공유 폴더 사용 시 접근이 필요한 계정에만 적절한 (읽기, 변경) 권한 설정
          5. 일반 공유 폴더 사용 시 공유 폴더 접근을 위한 비밀번호 설정
