platform: "7. PC"
platform_number: 7
items:
  - id: "PC-01"
    title: "비밀번호의 주기적 변경"
    severity: "상"
    domain: "PC > 1. 계정 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "최대 암호 사용 기간이 \"90일\" 이하 설정 여부 점검"
      check_purpose: "비밀번호를 주기적으로 변경하여 비밀번호 크래킹의 가능성을 낮추고, 불법으로 획득한 비밀번호의 무단 사용을 방지하기 위함"
      threat: "동일한 비밀번호를 변경하지 않고 오랫동안 사용할 경우 유출이나 무차별 대입 공격에 당할 가능성이 크고 이전에 사용하던 비밀번호를 재사용한다면 비밀번호 추측 공격으로 계정을 탈취당할 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "최대 암호 사용 기간이 \"90일\" 이하로 설정된 경우"
      vulnerable: "최대 암호 사용 기간이 \"제한 없음\"이거나 \"90일을\"을 초과하여 설정된 경우"
    action: |
      ※ 최대 암호 사용 기간 "90일" 설정
      ※ 최소 암호 사용 기간 "1일" 설정
      ※ 최근 암호 기억 설정 (권장: 24개의 비밀번호 기억)
      ※ 사용자가 새 비밀번호를 변경하기 전에 이를 유지해야 하는 일수를 결정. 비밀번호 변경 후 편의성 때문에 기존 비밀번호로 다시 설정하는 경우가 많으므로 최소 사용 기간을 설정
      ※ 이전 비밀번호를 다시 사용한다면 변경 주기가 의미가 없으므로 기존에 사용하던 비밀번호를 기억해서 사용하지 못하게 함
    impact: "비밀번호 변경 시 기존 사용했던 비밀번호를 재사용할 수 없음"
    examples:
      - os: "Windows 10, 11"
        content: |
          [계정별 비밀번호 기간 설정]
          Step 1) 시작 > 실행 > LUSRMGR.MSC
          Step 2) 사용자 > 계정별 속성 > "암호 사용 기간 제한 없음(P)", "계정 사용 안함(B)" 적용 해제

          [계정별 비밀번호 정책 적용]

          [비밀번호 정책 설정]
          Step 1) 시작 > Windows 관리 도구 > 로컬 보안 정책
          Step 2) 보안 설정 > 계정 정책 > 암호 정책 > "최대 암호 사용 기간" 속성을 "90일", "최근 암호 기억"을 "24개", "최소 암호 사용 기간"을 "1일"로 설정

          [비밀번호 정책 적용 확인]

  - id: "PC-02"
    title: "비밀번호 관리정책 설정"
    severity: "상"
    domain: "PC > 1. 계정 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "비밀번호 설정 정책이 복잡성을 만족하는지 점검"
      check_purpose: "안전한 비밀번호 (*비밀번호 설정 기준 참고)를 사용함으로써 무차별 대입 공격, 사전공격 등 비밀번호 탈취 목적의 공격에 대해 대비하기 위함"
      threat: "주기적으로 보안 패치를 적용하지 않을 경우, 버전 취약점을 이용한 공격 또는 새로운 공격에 대한 침해 사고가 발생할 수 있는 위험이 존재함"
      reference:
        - "-"
    criteria:
      good: "복잡성을 만족하는 비밀번호 정책이 설정된 경우"
      vulnerable: "비밀번호를 사용하지 않거나, 추측하기 쉬운 문자조합으로 이루어진 짧은 자릿수의 비밀번호를 설정된 경우"
    action: "비밀번호 정책을 해당 기관의 보안 정책에 적합하게 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 시작 > Windows 관리 도구(Windows Tools ) > 로컬 보안 정책
          Step 2) 보안 설정 > 계정 정책 > 암호 정책 > "최소 암호 길이" 속성을 "8문자(이상)", "암호는 복잡성을 만족해야함"을 "사용함"으로 설정

          [암호 정책 적용 확인]

          [비밀번호 설정 기준]
          1. 영문, 숫자, 특수문자를 조합하여 계정명과 상이한 8자 이상의 비밀번호 설정
          ※ 다음 각 항목의 문자 종류 중 2종류 이상을 조합하여 최소 10자리 이상 또는 3종류 이상을 조합하여 최소 8자리 이상의 길이로 구성
          (1) 영문 대문자(26개)
          (1) 영문 소문자(26개)
          (2) 숫자(10개)
          (3) 특수문자(32개)

          1. 비밀번호는 비인가자에 의한 추측이 어렵게 다음의 사항을 반영하여 설계
          (1) Null(공백) 비밀번호 사용 금지
          (1) 문자 또는 숫자만으로 구성 금지
          (2) 사용자 ID와 같거나 유사하지 않은 비밀번호 금지
          (3) 연속적인 문자나 숫자 사용 (예) 1111, 1234, abcd) 사용 금지
          (4) 주기성 비밀번호 재사용 금지
          (5) 전화번호, 생일과 같이 추측하기 쉬운 개인정보를 비밀번호로 사용 금지

          2. 아래와 같은 비밀번호 설정 지양
          Null, 계정과 같거나 유사한 스트링, 지역명, 부서명, 담당자명, 대표 업무명 "root", "rootroot", "root123", "123root", "admin", "admin123", "123admin", "osadmin", "adminos"

  - id: "PC-03"
    title: "복구 콘솔에서 자동 로그온을 금지하도록 설정"
    severity: "중"
    domain: "PC > 1. 계정관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "Windows 복구 콘솔 자동 로그인 설정이 허용 여부 점검"
      check_purpose: "복구 콘솔 자동 로그온 허용을 \"사용 안 함\"으로 설정함으로써 비인가자의 복구 콘솔을 통한 관리자 권한 탈취 등의 위험을 방지하기 위함"
      threat: "Windows 복구 콘솔(Recovery Console) 자동 로그온 설정은 시스템 액세스 허가 전 Administrator 계정의 비밀번호 제공 여부를 결정하는 것으로 이 옵션을 사용하면 비인가자도 복구 콘솔을 이용해 관리자 권한으로 시스템에 자동으로 로그온할 수 있는 위험이 존재함"
      reference:
        - "※ 복구 콘솔(Recovery Console): Windows 2000, Windows XP, Windows 서버 2003 운영 체제의 기능 가운데 하나로 Windows가 그래픽 사용자 인터페이스(GUI)가 나타날 때까지 시동이 되지 않는 상황에서 관리자들이 복구할 수 있게 하는 것이 주된 기능임. 이 콘솔을 통해 관리자들이 명령줄 인터페이스를 이용하여 제한된 영역의 작업을 수행할 수 있음"
    criteria:
      good: "복구 콘솔 자동 로그온 허용이 \"사용 안 함\"으로 설정된 경우"
      vulnerable: "복구 콘솔 자동 로그온 허용이 \"사용\"으로 설정된 경우"
    action: "복구 콘솔 자동 로그온 허용 \"사용 안 함\"으로 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 시작 > 모든 앱 > Windows Tools > 로컬 보안 정책 > 보안 설정 > 로컬 정책 > 보안 옵션
          Step 2) "복구 콘솔: 자동 관리 로그온 허용" 속성 "사용 안 함" 설정

          ["복구 콘솔: 자동 관리 로그온 허용" "사용 안함" 설정]

  - id: "PC-04"
    title: "공유 폴더 제거"
    severity: "상"
    domain: "PC > 2. 서비스 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "기본 공유 폴더(C$, D$, Admin$), 미사용 공유 폴더가 존재하는지 점검하고 공유 폴더를 사용하는 경우 공유 폴더 접근 권한에 \"Everyone\"이 존재하거나 접근을 위한 비밀번호 설정 여부 점검"
      check_purpose: "사용하지 않는 불필요한 공유 폴더를 해제하거나 불가피하게 사용하고 있는 공유 폴더의 경우 비밀번호를 설정하는 등의 조치를 통해 인가된 사용자만 접근할 수 있게 함으로써 무분별한 접근을 제한하기 위함"
      threat: |
        ▪ 시스템 기본 공유 폴더의 경우 기본 드라이브를 개방해놓고 사용하는 것과 같은 위험이 존재함 (예시 : 실행 창 -> \\192.168.16.xxx\C$로 C 드라이브 접근 가능)
        ▪ 접근 권한이 Everyone으로 설정된 공유 폴더는 정보 유출 및 악성코드 유포의 접점이 될 수 있는 위험이 존재함
      reference:
        - "-"
    criteria:
      good: "불필요한 공유 폴더가 존재하지 않거나 공유 폴더에 접근 권한 및 비밀번호가 설정된 경우"
      vulnerable: "불필요한 공유 폴더가 존재하거나 접근 권한 및 비밀번호 설정 없이 공유 폴더가 사용된 경우"
    action: |
      ▪ 공유 폴더 불필요 시 삭제
      ▪ 공유 폴더 필요하면 적절한 접근 권한 부여 및 비밀번호 설정
      ▪ 조치 후 "AutoShareWks"값 변경으로 자동 공유 방지
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          [기본 공유 폴더 설정]
          Step 1) 기본 공유 폴더 상태 확인 및 공유 중지
          시작 > 모든 앱> Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          (시작 > 실행 > "fsmgmt.msc" 입력 > 공유)
          Step 2) 불필요한 공유 폴더 확인 > 해당 공유 폴더 우클릭 > 공유 중지(S)

          [공유 폴더 "공유 중지" 설정]

          Step 3) 시작 > 모든 앱 > Windows Tools > 레지스트리 편집기
          Step 4) 레지스트리 경로로 이동
          HKLM\SYSTEM\CurrentControlSet\Service\LanmanServer\Parameters
          Step 1) 설정값 입력

          | Value name | SecurityLevel |
          | Data Type | Dword 값 |
          | Value | 0(zero) |

          ["AutoShareWks" 레지스트리 값 0으로 설정]

          Step 5) 값이 없는 경우, 새로 만들기 > "AutoShareWks"를 추가하고 값을 "0"으로 입력
          아래 그림과 같이 "AutoShareWks"를 입력하며, 이때 값은 기본값인 "0"으로 유지
          또한, 방화벽과 라우터에서 135,139(TCP/UDP) Port를 차단하여 보안성을 높일 수 있음

          ※ 기본 공유에 대한 조치 시 반드시 [기본 공유 삭제], [비활성화 레지스트리 값]을 모두 설정함

          [일반 공유 폴더 설정]
          Step 1) 일반 공유 폴더 확인 및 공유 중지
          시작 > 모든 앱 > Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          (시작 > 실행 > "fsmgmt.msc" 입력 > 공유)
          Step 2) 불필요한 공유 폴더 확인 > 해당 공유 폴더 우클릭 > 공유 중지

          [공유 중지]

          Step 3) 일반 공유 폴더 필요한 시 권한 설정
          시작 > 모든 앱 Windows Tools > 컴퓨터 관리 > 공유 폴더 > 공유
          Step 4) 사용할 공유 폴더 확인 선택 후 우클릭 > 속성 > [공유] 탭 > [공유 사용 권한] 탭 "Everyone"으로 된 공유를 제거하고, 접근이 필요한 계정에만 적절한 권한 추가

          [공유 사용 권한 "Everyone" 제거]

          [공유 폴더 접근 비밀번호 설정]
          Step 1) 시작 > 설정 > 네트워크 및 인터넷 > 고급 네트워크 설정 > 고급 공유 설정 > 모든 네트워크
          Step 2) "암호로 보호된 공유" 켬 설정
          Step 3) 공유 폴더 접근 가능 여부 확인
          시작 > 모든 앱 > Windows Tools > 실행 > 공유 폴더 PC 계정명 또는, IP주소 입력 후 비밀번호 입력 팝업 확인

          [공유 폴더 접근 가능 여부 확인]

          [공유 폴더 설정 기준]
          1. C$, D$, Admin$ 등의 기본 공유 폴더 제거
          2. 기본 공유 폴더 제거 후 시스템 재부팅 시 "기본 공유 폴더가 자동으로 공유되는 것"을 방지하기 위해 해당 레지스트리의 "AutoShareWks" 값을 "0"으로 설정
          3. 일반 공유 폴더 사용 시 공유 폴더 접근 권한에 "Everyone" 제거
          4. 일반 공유 폴더 사용 시 접근이 필요한 계정에만 적절한 (읽기, 변경) 권한 설정
          5. 일반 공유 폴더 사용 시 공유 폴더 접근을 위한 비밀번호 설정

  - id: "PC-05"
    title: "불필요한 서비스 제거"
    severity: "상"
    domain: "PC > 2. 서비스 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "사용하지 않는 서비스나 기본으로 설치되어 실행되고 있는 서비스 여부 점검"
      check_purpose: "사용하지 않는 서비스나 기본으로 설치된 서비스들을 제거하여 시스템 자원의 낭비를 막고 해당 서비스 포트를 통한 침입을 방지하기 위함"
      threat: |
        ▪ 실질적 사용하지 않는 서비스들이 실행되어 시스템에 과부하가 발생하는 위험이 존재함
        ▪ 불필요한 서비스의 경우 사용자가 알지도 못한 서비스들이 실행되고 있는 경우가 대부분, 이 경우 해당 서비스가 이미 취약한 버전의 서비스인지도 인지하지 못하고 사용하는 위험이 존재함
      reference:
        - "※ 불필요한 서비스가 시스템에 디폴트로 설치되어 실행되는 경우 시스템 자원을 낭비하게 될 뿐만 아니라, 이 서비스를 통해 악의적인 공격자가 침입할 수 있으므로 필요하지 않은 서비스는 중지시켜야 함"
        - "※ 시스템 관리자는 대상 시스템의 용도를 정확히 파악한 후 특별한 목적으로 사용하는 업무 관련 서비스를 제외한 다른 불필요한 서비스를 제거해야 함"
        - "※ OS 버전에 따라 '일반적으로 불필요한 서비스' 목록에 나열된 서비스가 제공되지 않을 수 있음"
    criteria:
      good: "일반적으로 불필요한 서비스(아래 목록 참조)가 중지된 경우"
      vulnerable: "일반적으로 불필요한 서비스(아래 목록 참조)가 중지되지 않은 경우"
    action: "불필요한 서비스 중지 설정"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 11"
        content: |
          Step 1) 시작 > 모든 앱 Windows Tools > 서비스 > 해당 서비스 선택 > 속성
          (시작 > 모든 앱 > Windows Tools > 실행 > "services.msc" 입력> 해당 서비스 선택> 속성에서도 설정 가능)
          Step 2) 불필요한 서비스 -> 중지 / 시작 유형 -> 사용 안 함

          [불필요한 서비스 선택 후 '사용 안 함' 설정]

          Step 3) 서비스마다 옵션을 설정할 수 있음
          해당 서비스를 선택하고 더블 클릭하여 "시작 유형" 선택 및 "시작 시 로그온 계정" 별도 설정 가능. 시스템 시작 시 자동으로 시작되게 하려면 [자동], 수동으로 서비스를 시작하려면 [수동], 서비스 자체를 사용하지 않으려면 [사용 안 함]을 선택한 후 [확인]을 클릭

          | 서비스 시작 유형 | 설명 |
          |---|---|
          | 사용 안 함 | 설치되어 있으나 실행되지 않음 |
          | 수동 | 다른 서비스나 응용 프로그램에서 해당 기능을 필요로 할 때만 시작됨 |
          | 자동 | 부팅 시에 해당 장치 드라이버가 로드된 후에 운영체제에 의해 시작됨 |

          ※ 꼭 필요한 서비스만 사용하고 나머지는 "사용 안 함"으로 설정
          ※ 개인 방화벽 실행
          ※ 백신 등에서 제공하는 방화벽 기능 활성화 사용
          ※ 일반적으로 불필요한 서비스

          | 서비스명 | 기능 및 설명 |
          |---|---|
          | Alerter | 네트워크상에서 사용자와 컴퓨터에 관리용 경고메시지를 전송하는 기능 |
          | Automatic Updates | 중요한 윈도우 업데이트를 다운로드하고 설치할 수 있도록 하는 애플리케이션. 수동패치를 적용하거나, MS패치 관리 서버로 패치를 일괄적으로 관리하는 경우 불필요한 서비스 |
          | Clipbook | 서버 내 Clipbook을 다른 클라이언트와 공유 |
          | Computer Browser | 네트워크에 있는 모든 컴퓨터의 목록을 업데이트하고 관리하는 기능 |
          | Cryptographic Services | 윈도우 파일의 서명을 확인하는 카탈로그 데이터베이스 서비스를 총괄 |
          | DHCP Client | IP주소와 DNS 이름을 DHCP 서버에 등록하거나 DHCP 서버로부터 동적으로 IP주소를 가져오는 기능을 수행. 단독으로 시스템을 수행하며 고정IP를 사용하는 경우 불필요한 서비스 |
          | Distributed Link Tracking Client, Server | 네트워크 도메인의 여러 컴퓨터나 일반 컴퓨터에서 NTFS 파일간의 연결을 관리하는 도구. Active Directory가 구성되어 있지 않은 서버에서는 불필요한 서비스 |
          | DNS Client | 컴퓨터에 대한 도메인 이름 시스템(DNS) 이름을 확인하고 캐시에 보관하는 기능. DNS서버가 아닌 시스템에서는 유명무실하나, IPSEC을 사용하는 경우 필요한 경우 있음 |
          | Error reporting Service | 프로그램 오류가 발생 시 응용프로그램의 오류를 MS에 보고한다는 내용을 표시하는 기능 |
          | Human Interface Device Access | 키보드 또는 기타 멀티미디어 장치에 사전 정의된 버튼들을 사용하는 HID 장치들을 위한 서비스 |
          | IMAPI CD-Burning COM Service | 서버에 CD-RW 또는 DVD-RW가 장착되어 보조백업장치 역할을 하기 위해서 자체 레코딩 백업을 할 수 있음 |
          | Infrared Monitor | 사용자 적외선 연결을 통해 파일 및 이미지를 공유할 수 있도록 함 |
          | Messenger | 클라이언트와 서버 사이에 netsend 및 경고서비스 메시지를 전송하는 기능 |
          | NetMeeting Remote Desktop Sharing | 윈도우9X 운영체제부터 인증된 사용자가 넷미팅을 사용해서 원격으로 컴퓨터에 접근할 수 있도록 하는 기능 |
          | Portable Media Serial Number | 컴퓨터에 연결된 이동성 미디어의 등록번호를 가져오는 기능 |
          | Print Spooler | 인쇄 과정에 있는 스풀링을 관리하는 서비스. 프린터가 있는 경우 필수 서비스이나, 프린터가 연결되지 않은 시스템에서는 불필요함 |
          | Remote Registry | 원격 사용자가 컴퓨터에서 레지스트리 설정을 수정할 수 있도록 설정하는 응용 프로그램 |
          | Simple TCP/IP Services | Echo, Discard, Character Generator, Daytime, Quote of the Day 지원 |
          | Universal Plug and Play Device Host | 네트워크 장치에 대해 피어-투-피어 UPnP(범용 플러그 앤 플레이) 기능을 지원 |
          | Wireless Zero Configuration | 802.11 어댑터에 대해 자동 구성을 공급하는 기본적인 도구 |

          ※ 운영 중인 시스템에서 필수 서비스를 정의하는 것은 매우 복잡한 과정으로 서비스 사용 여부는 시스템의 영향성을 고려하여 신중하게 평가되어야 하므로 Microsoft에서 권고하는 가이드에 따라 전략적으로 적용해야 함
          ※ https://technet.microsoft.com/ko-kr/library/dd547941.aspx (서비스 및 서비스 계정 보안 계획 가이드) 참고
          ※ 윈도우 시스템 설치 시 기본적으로 설치되는 서비스에 대한 상세 설명은 아래 주소 참조
          ※ https://technet.microsoft.com/ko-kr/library/dd547949.aspx

  - id: "PC-06"
    title: "비인가 상용 메신저 사용 금지"
    severity: "상"
    domain: "PC > 2. 서비스 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "사용자 PC에서 상용 메신저 사용 여부 점검"
      check_purpose: "상용 메신저 차단을 통하여 메신저를 이용한 개인정보 및 내부 주요 정보 유출을 막기 위함"
      threat: "일반 사용자 PC에서 메신저 차단을 하지 않을 경우, 메신저를 통해 주요 정보가 유출되거나, 악성코드가 유입될 위험이 존재함"
      reference:
        - "※ 메신저(Messenger): 인터넷을 통해 실시간으로 대화를 나눌 수 있는 서비스."
        - "※ 악성코드: 컴퓨터에 악영향을 끼칠 수 있는 모든 소프트웨어의 총칭"
        - "※ 상용 메신저: 네이트온, 카카오톡 PC 버전, Skype 같은 메신저 프로그램"
    criteria:
      good: "Windows Messenger가 실행 중지된 상태이거나 상용 메신저가 설치되지 않은 경우"
      vulnerable: "Windows Messenger가 실행 중이거나 상용 메신저가 설치된 경우"
    action: "\"Windows Messenger를 실행하지 않음\" 설정 및 상용 메신저 삭제"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 시작 > 모든 앱 > Windows Tools > 실행 > "gpedit.msc"입력 > 컴퓨터 구성 > 관리 템플릿 > Windows 구성 요소 > Windows Messenger
          Step 2) "Windows Messenger를 실행 허용 안 함" 설정을 "사용"으로 설정

          ["Windows Messenger 실행 안 함" "사용"으로 설정]

  - id: "PC-07"
    title: "파일 시스템이 NTFS 포맷으로 설정"
    severity: "중"
    domain: "PC > 2. 서비스 관리"
    target: "Windows 10, Windows 11"
    description:
      check_content: "하드 디스크의 파일 시스템이 NTFS를 사용 여부 점검"
      check_purpose: "보안성 기능이 없는 FAT32를 지양하고 사용 권한 및 암호화를 통해 특정 파일에 대한 특정 사용자의 액세스를 제한할 수 있는 NTFS를 사용하여 보안성을 강화하기 위함"
      threat: "FAT32 파일 시스템을 사용하는 경우, 사용자의 컴퓨터에 액세스하는 사람은 누구나 컴퓨터 안에 있는 파일을 읽을 수 있으므로, 중요 파일에 접근할 수 없는 비인가자가 주요 정보를 유출할 수 있는 위험이 존재함"
      reference:
        - "※ 기존에 FAT 파일 시스템을 사용하다가 NTFS로 변환하기 위해서는 convert.exe 명령을 사용할 수 있지만, FAT 파일 시스템으로 운영 중 변환해야 하는 경우 기본 ACL이 적용되지 않으므로 가능한 초기 설치 시 NTFS 파일 시스템을 선택하는 것을 권장함"
        - "※ ACL: 프로세스가 시스템이나 파일에 읽기, 쓰기, 실행 등의 접근 여부를 허가하거나 거부하는 기능"
        - "※ NTFS, FAT32 파일 시스템 비교: FAT32에는 NTFS가 제공하는 보안 기능이 없으므로 컴퓨터에 FAT32 파티션 또는, 볼륨이 있는 경우 컴퓨터에 액세스 가능한 모든 사용자가 파일을 읽을 수 있으며 FAT32에는 크기 제한이 있음"
    criteria:
      good: "모든 디스크 볼륨의 파일 시스템이 NTFS인 경우"
      vulnerable: "모든 디스크 볼륨의 파일 시스템이 FAT32인 경우"
    action: "모든 디스크 볼륨에 대해 파일 시스템 NTFS로 변경"
    impact: "일반적인 경우 영향 없음"
    examples:
      - os: "Windows 10, Windows 11"
        content: |
          Step 1) 디스크 볼륨의 파일 시스템이 "NTFS"인지 확인
          시작 > 모든 앱 > Windows Tools > 컴퓨터 관리 > 저장소 > 디스크 관리
          시작 > 모든 앱 > Windows Tools > 실행 > "diskmgmt.msc" 입력 > 디스크 관리
          Step 2) 모든 디스크 볼륨의 파일 시스템이 "NTFS"가 아닌 경우 취약점이 존재하므로, 모든 디스크 볼륨에 대해 파일 시스템을 "NTFS"로 변경

          [디스크 파일 볼륨의 파일 시스템 확인]

          Step 3) NTFS 변경 후 폴더 및 파일에 적합한 ACL 적용
          1. 폴더나 파일을 마우스 오른쪽 버튼 클릭 후 단축메뉴에서 [속성] 선택
          2. [속성] 대화상자에서 [보안] 탭을 선택
          3. 편집을 눌러 그룹이나 계정에 맞는 권한으로 변경
