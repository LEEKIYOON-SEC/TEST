  - 퇴사 및 부서 이동 등의 사유로 출입권한이 불필요하게 된 인원이 있는가?
  - 장기간 출입기록이 없어 출입권한이 불필요한 인원이 있는가?
  - 일과 외 시간 등 출입 사유가 타당하지 않는 것으로 추정되는 출입기록(출입인원)이 있는가?
  - 시스템으로 출입 및 접근로그를 남길 수 없는 경우 기록된 출입관리대장을 검토하여야 한다.
